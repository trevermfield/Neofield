# Builds the game and publishes it as the website (GitHub Pages) every time main changes.
name: Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      # GitHub Pages sometimes fails on its own side (a 500, a deploy stuck
      # syncing, or the just-uploaded artifact not showing up yet). Try once
      # more after a short wait before calling the deploy failed.
      - id: deploy-first
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deploy-first.outcome == 'failure'
        run: sleep 60
      - id: deploy-retry
        if: steps.deploy-first.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - id: deployment
        run: echo "page_url=${{ steps.deploy-retry.outputs.page_url || steps.deploy-first.outputs.page_url }}" >> "$GITHUB_OUTPUT"
