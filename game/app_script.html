  Rock: '#c2a95c', Ghost: '#7f6bb0', Dragon: '#7b63f2', Dark: '#8a7466', Steel: '#9fb3d4', Fairy: '#ee9ad0', Stellar: '#ffffff',
};
const STATUS = {psn: ['Poisoned', '#b06ee0', 'drop'], tox: ['Badly poisoned', '#b06ee0', 'drop'], brn: ['Burned', '#f08a4b', 'flame'], par: ['Paralyzed', '#f2d04a', 'bolt'], slp: ['Asleep', '#b8c0cc', 'moon'], frz: ['Frozen', '#86d8ec', 'flake']};
const statusPill = (st, small) => STATUS[st] ? `<span class="stpill icon st-${st}${small ? ' small' : ''}" title="${STATUS[st][0]}" aria-label="${STATUS[st][0]}">${emblem(STATUS[st][2], '#10131a')}</span>` : '';   // a symbol only, never a word
const STAT_NAMES = {atk: 'Attack', def: 'Defense', spa: 'Sp. Atk', spd: 'Sp. Def', spe: 'Speed', accuracy: 'accuracy', evasion: 'evasiveness'};
const STAT_SHORT = {atk: 'Atk', def: 'Def', spa: 'SpA', spd: 'SpD', spe: 'Spe', accuracy: 'Acc', evasion: 'Eva'};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
// ---------- storage and save slots ----------
// Each phone has 4 save slots. A slot holds an Adventure half and a Battle Hall half; built teams,
// recently used teams and settings are shared by all slots.
const NSLOTS = 4;
const SLOT_KEYS = new Set(['myTeam', 'customTeam', 'difficulty', 'badgeBook', 'badges', 'champions', 'journey', 'adventure', 'profile', 'hallTeam']);
const ADV_KEYS = ['adventure'];
const HALL_KEYS = ['myTeam', 'customTeam', 'difficulty', 'badgeBook', 'badges', 'champions', 'journey', 'hallTeam'];
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* storage unavailable */ } },
};
const slotKey = (n, k) => `slot${n}.${k}`;
// Saves from before save slots move into Slot 1, once.
if (ls.get('saveVersion', 1) < 2) {
  let had = false;
  for (const k of SLOT_KEYS) {
    try {
      const v = localStorage.getItem(k);
      if (v != null) { had = true; if (localStorage.getItem(slotKey(1, k)) == null) localStorage.setItem(slotKey(1, k), v); localStorage.removeItem(k); }
    } catch (e) { /* storage unavailable */ }
  }
  if (had && !ls.get(slotKey(1, 'profile'), null)) {
    const adv = ls.get(slotKey(1, 'adventure'), null);
    ls.set(slotKey(1, 'profile'), {name: (adv && adv.playerName) || '', hall: true, lastPlayed: Date.now(), playMs: 0});
  }
  ls.set('saveVersion', 2);
  if (had) ls.set('lastSlot', 1);
}
let curSlot = Math.min(NSLOTS, Math.max(1, +ls.get('lastSlot', 1) || 1));
const store = {
  get(k, d) { return ls.get(SLOT_KEYS.has(k) ? slotKey(curSlot, k) : k, d); },
  set(k, v) { ls.set(SLOT_KEYS.has(k) ? slotKey(curSlot, k) : k, v); },
  del(k) { ls.del(SLOT_KEYS.has(k) ? slotKey(curSlot, k) : k); },
};

    bolt: `<path d="M28 3 9 27h13l-4 18 21-26H26Z" fill="${c}"/>`,
    leaf: `<path d="M41 6C18 6 7 18 7 32c0 4 1 7 3 10 3-12 10-20 21-26-9 7-15 15-18 27 3 1 6 2 9 2 15 0 22-14 19-39Z" fill="${c}"/>`,
    bug: `<ellipse cx="24" cy="28" rx="12" ry="15" fill="${c}"/><path d="M24 13v30" stroke="#10131a" stroke-width="2" opacity=".5"/><g stroke="${c}" stroke-width="3" stroke-linecap="round"><path d="M19 13 13 5M29 13l6-8M12 24H4M36 24h8M12 34l-7 5M36 34l7 5"/></g>`,
    fairy: `<path d="M24 4l4 13 13 1-10 8 4 14-11-8-11 8 4-14-10-8 13-1Z" fill="${c}"/><circle cx="40" cy="38" r="3" fill="${c}" opacity=".7"/><circle cx="9" cy="40" r="2" fill="${c}" opacity=".6"/>`,
    wing: `<path d="M6 40C10 22 22 10 42 6c-4 6-8 9-13 11 6 0 10-1 14-3-4 7-10 11-17 12 5 1 9 0 13-2-6 9-17 14-33 16Z" fill="${c}"/>`,
    fist: `<path d="M12 22c0-3 2-5 5-5h17c3 0 5 2 5 5v9c0 8-6 13-13 13h-3c-6 0-11-5-11-11Z" fill="${c}"/><path d="M17 17v-5a3 3 0 0 1 6 0v5M23 17v-6a3 3 0 0 1 6 0v6M29 17v-5a3 3 0 0 1 6 0v5" fill="${c}"/><path d="M18 24h17M18 30h12" stroke="#10131a" stroke-width="2" opacity=".35"/>`,
    flame: `<path d="M24 3c3 9 14 14 14 27a14 14 0 0 1-28 0c0-7 4-11 7-14 0 5 2 8 5 9-2-8 0-15 2-22Z" fill="${c}"/><path d="M24 26c2 4 6 6 6 11a6 6 0 0 1-12 0c0-4 4-6 6-11Z" fill="#10131a" opacity=".3"/>`,
    eye: `<path d="M3 24c6-10 13-15 21-15s15 5 21 15c-6 10-13 15-21 15S9 34 3 24Z" fill="${c}"/><circle cx="24" cy="24" r="8" fill="#10131a" opacity=".55"/><circle cx="24" cy="24" r="3" fill="${c}"/>`,
    ghost: `<path d="M9 44V22a15 15 0 0 1 30 0v22l-5-4-5 4-5-4-5 4-5-4Z" fill="${c}"/><circle cx="18" cy="22" r="3" fill="#10131a" opacity=".6"/><circle cx="30" cy="22" r="3" fill="#10131a" opacity=".6"/>`,
    wave: `<path d="M24 4C24 4 11 20 11 29a13 13 0 0 0 26 0C37 20 24 4 24 4Z" fill="${c}"/><path d="M15 31c3 3 6 3 9 0s6-3 9 0" stroke="#10131a" stroke-width="2.5" fill="none" opacity=".4" stroke-linecap="round"/>`,
    pyramid: `<path d="M24 6 44 40H4Z" fill="${c}"/><path d="M24 6 30 40H18Z" fill="#10131a" opacity=".22"/><path d="M11 28h26" stroke="#10131a" stroke-width="2" opacity=".3"/>`,
    dragon: `<path d="M8 40c4-12 10-20 18-24l-4-9 9 6 9-3-3 8 7 4-9 2c-1 8-6 14-14 17l3-8c-5 2-10 5-16 7Z" fill="${c}"/><circle cx="33" cy="15" r="1.8" fill="#10131a" opacity=".7"/>`,
    crown: `<path d="M6 35 4 13l11 9 9-14 9 14 11-9-2 22Z" fill="${c}"/><rect x="6" y="37" width="36" height="5" rx="1.5" fill="${c}"/><circle cx="24" cy="27" r="3" fill="#10131a" opacity=".35"/>`,
    star: `<path d="M24 4l5.9 12.6 13.6 1.7-10 9.5 2.6 13.6L24 34.8 11.9 41.4l2.6-13.6-10-9.5 13.6-1.7Z" fill="${c}"/>`,
  };
  return `<svg viewBox="0 0 48 48" aria-hidden="true">${shapes[kind] || shapes.star}</svg>`;

// ---------- state ----------
let E = null;               // engine global
const DIFFS = {
  easy:   {label: 'Easy',   note: 'The computer often picks random moves, never switches out and rarely Mega Evolves.'},
  normal: {label: 'Normal', note: 'The computer picks strong moves and sometimes switches out of bad matchups.'},
  hard:   {label: 'Hard',   note: 'The computer picks its strongest move every turn and always Mega Evolves.'},
};
let difficulty, badgeBook, champions;
function loadHallState() {
  difficulty = store.get('difficulty', 'normal');
  if (!DIFFS[difficulty]) difficulty = 'normal';
  badgeBook = store.get('badgeBook', null) || {easy: {}, normal: store.get('badges', {}) || {}, hard: {}};
  champions = store.get('champions', {});
}
loadHallState();
const badgesFor = d => badgeBook[d] || (badgeBook[d] = {});
let ctx = null;             // null = single gym battle, or {kind: 'gauntlet' | 'journey', ...}
const fxType = {p1: 'Normal', p2: 'Normal'};
let battle = null, mem = {}, logIdx = 0, view = null, playing = false, skip = false, panel = 'fight';
let mc = null;   // a doubles/triples turn being chosen, one Mon at a time
const isMulti = () => !!battle && battle.activePerHalf > 1;
const slotsOf = side => Array.from({length: battle.activePerHalf}, (_, i) => side + 'abc'[i]);
let mode = 'cpu';           // 'cpu' or 'online'
let ME = 'p1', FOE = 'p2';

// online state
let db = null, user = null, myUid = null, canWrite = null;

// ---------- setup screen ----------
function renderBadges() {
  const badges = badgesFor(difficulty);
  const got = ORDER.filter(k => badges[k]).length;
  $('badgeCount').innerHTML = `${esc(DIFFS[difficulty].label)} · ${got} of ${ORDER.length}${champions[difficulty] ? '<span class="champchip">Champion</span>' : ''}`;
  $('badges').innerHTML = ORDER.map(k => {
    const L = LEADERS[k];
    return `<div class="badge ${badges[k] ? 'earned' : ''}" style="--c:${L.color}" title="${esc(L.badge)}${badges[k] ? ' earned' : ''}">${emblem(L.icon, L.color)}<span>${esc(L.badge.replace('badge', ''))}</span></div>`;
  }).join('');
}

// The Battle Hall's "Your team" panel (built in the hall section further down).
function renderTeamChips() { if (typeof renderTeamPanel === 'function') renderTeamPanel(); }

function teamNames(text) {
  return (text || '').split(/\n\s*\n/).map(b => b.trim().split('\n')[0].split(' @ ')[0].replace(/\s*\((M|F)\)\s*$/, '').replace(/^.*\((.+)\)$/, '$1').trim()).filter(Boolean).join(' · ');
}

function renderLeaders() {
  const badges = badgesFor(difficulty);
  renderGauntletCard();
  $('leaders').innerHTML = ORDER.map(k => {
    const L = LEADERS[k];
    const mons = E ? teamNames(E.TEAM_TEXT[k]) : '';
    return `<button class="leader" id="leader-${k}" data-k="${k}" style="--c:${L.color}" ${E ? '' : 'disabled'}>
      ${emblem(L.icon, L.color)}
      <div class="who"><div class="meta">${esc(L.type)} · ${esc(L.badge)}</div><div class="title">${esc(L.title)}</div><div class="mons">${esc(mons)}</div></div>
      <div class="go">${badges[k] ? 'REMATCH' : 'BATTLE'}</div></button>`;
  }).join('') + oklaCard();
}
// Prof. Okla joins the Battle Hall once he has been beaten in this slot's adventure (never counted as a badge)
function oklaCard() {
  let beat = false;
  try { beat = !!(A && A.lab && A.lab.beat); } catch (e) { beat = false; }
  if (!beat) return '';
  const L = LEADERS.okla, mons = E ? teamNames(E.TEAM_TEXT.okla) : '';
  return `<button class="leader" id="leader-okla" data-k="okla" style="--c:${L.color}" ${E ? '' : 'disabled'}>${emblem(L.icon, L.color)}
    <div class="who"><div class="meta">${esc(L.type)} · ${esc(L.badge)}</div><div class="title">${esc(L.title)}</div><div class="mons">${esc(mons)}</div></div><div class="go">BATTLE</div></button>`;
}

$('leaders').addEventListener('click', e => {
  const b = e.target.closest('.leader'); if (!b || !E) return;
  startCpuBattle(b.dataset.k);
});

function myTeamText() { const m = myTeam(); return m ? (m.text || E.setsToText(m.sets)) : null; }
function baseName() { const m = myTeam(); return m ? m.name : 'Player'; }
function needTeam() { openHall(); toast('Pick a team for the Battle Hall first.'); }

const SCREENS = ['title', 'slots', 'options', 'setup', 'teams', 'builder', 'moned', 'lead', 'battle', 'info', 'jstart', 'journey', 'jbag', 'shop', 'quest', 'trail', 'summit', 'farm', 'dev', 'intro', 'dex'];
let curScreen = null;
function show(id) { curScreen = id; $('toast').hidden = true; for (const s of SCREENS) $(s).hidden = s !== id; window.scrollTo(0, 0); }
function setAccent(color) { document.documentElement.style.setProperty('--accent', color); }

// ---------- shared battle start ----------
function beginBattle(p1, p2, seed, gameType) {
  $('forfeit').textContent = 'Forfeit';
  battle = E.createBattle(p1, p2, seed, gameType);
  logIdx = battle.log.length;
  view = {p1: blankMon(), p2: blankMon()};
  if (battle.activePerHalf > 1) for (const sd of ['p1', 'p2']) for (const k of slotsOf(sd)) view[k] = blankMon();
  for (const k of Object.keys(hpAnim)) delete hpAnim[k];
  hpAnim.p1 = hpAnim.p2 = null;
  mc = null;
  panel = 'fight'; resultShown = false;
  $('log').innerHTML = '';
  $('overlay').hidden = true;
  $('vsMeta').textContent = mode === 'online' ? 'Online battle' : (foe.subtitle || '');
  $('vsLabel').textContent = `You vs ${foe.name}`;
  for (const id of ['myCard', 'foeCard']) $(id).classList.remove('fx-hit', 'fx-shake', 'fx-act', 'fx-faint');
  bagSel = null;
}

let leadSel = [];
function leadNeed() { return Math.min(battle.activePerHalf, battle[ME].pokemon.filter(p => !p.fainted).length); }
function showLeadScreen() {
  leadSel = [];
  const foeLead = battle[FOE].pokemon[0];
  $('leadTitle').textContent = `vs ${foe.title || foe.name}${foe.wild && foeLead ? ` · Lv ${foeLead.level}` : ''}`;
  $('leadSub').textContent = mode === 'cpu'
    ? `${foe.subtitle || ''}. ${battle.activePerHalf > 1 ? `Pick ${leadNeed()} Mon${leadNeed() === 1 ? '' : 's'} to send out first, in order.` : 'Pick who goes out first.'}`
    : `Online battle. Pick who goes out first. ${foe.name} is choosing too.`;
  $('foeRoster').innerHTML = battle[FOE].pokemon.map(p => `${esc(p.species.name)} <span class="lvl">Lv ${p.level}</span> ${typesHTML(p.species.types)}`).join('<br>');
  const carry = ctx && ctx.kind !== undefined;
  $('leadList').innerHTML = battle[ME].pokemon.map((p, i) => {
    if (p.name === 'Nobody') return '';
    const pct = p.maxhp ? p.hp / p.maxhp * 100 : 0;
    const hpBar = carry ? `<span class="hpmini"><i style="width:${pct}%;background:${hpColor(pct)}"></i></span><small>${p.fainted ? 'Fainted' : `${p.hp}/${p.maxhp} HP`} ${p.status && !p.fainted ? statusPill(p.status, true) : ''}</small>` : '';
    return `<button class="pick" id="lead-${i}" data-i="${i + 1}" ${p.fainted ? 'disabled' : ''}><div><b><span class="ord" hidden></span>${esc(p.species.name)} <span class="lvl">Lv ${p.level}</span></b><small>${esc(p.item ? E.Dex.items.get(p.item).name : '')} · ${p.moveSlots.map(m => esc(m.move)).join(', ')}</small>${hpBar}</div>${typesHTML(p.species.types)}</button>`;
  }).join('') + (battle.activePerHalf > 1 ? `<button class="btn primary leadgo" id="leadGo" disabled>Send out</button>` : '');
  $('leadBack').textContent = mode !== 'cpu' ? 'Back to lobby' : ctx && ctx.kind === 'journey' ? 'Back to map' : 'Back';
  show('lead');
}

$('leadBack').addEventListener('click', () => leaveBattle());
function leadOrder(first) { return [...first, ...battle[ME].pokemon.map((_, i) => i + 1).filter(i => !first.includes(i))]; }
$('leadList').addEventListener('click', e => {
  if (battle.activePerHalf > 1) {
    if (e.target.closest('#leadGo')) { if (leadSel.length === leadNeed()) { show('battle'); commit('team ' + leadOrder(leadSel).join('')); } return; }
    const pb = e.target.closest('.pick'); if (!pb || pb.disabled) return;
    const n = +pb.dataset.i, at = leadSel.indexOf(n);
    if (at >= 0) leadSel.splice(at, 1); else if (leadSel.length < leadNeed()) leadSel.push(n);
    $('leadList').querySelectorAll('.pick').forEach(el => {
      const k = leadSel.indexOf(+el.dataset.i), o = el.querySelector('.ord');
      el.classList.toggle('sel', k >= 0); o.hidden = k < 0; o.textContent = k + 1;
    });
    $('leadGo').disabled = leadSel.length !== leadNeed();
    return;
  }
  const b = e.target.closest('.pick'); if (!b) return;
  const lead = +b.dataset.i;
  if (battle[ME].pokemon[lead - 1].fainted) return;
  const order = [lead, ...battle[ME].pokemon.map((_, i) => i + 1).filter(i => i !== lead)];
  show('battle');
  commit('team ' + order.join(''));
});

function blankMon() { return {ident: '', species: '', hp: 0, maxhp: 100, status: '', boosts: {}}; }
function typesHTML(types) { return `<span class="types">${types.map(t => `<span class="type" style="--t:${TYPE_COLORS[t] || '#999'}">${esc(t)}</span>`).join('')}</span>`; }

// ---------- computer battles ----------
function startCpuBattle(k) {
  const mine = myTeam();
  if (!mine) { needTeam(); return; }
  ctx = null;
  noteUsed(mine);
  const L = LEADERS[k];
  foe = {name: L.first, key: k, color: L.color, icon: L.icon, title: L.title, subtitle: `${L.badge} · ${DIFFS[difficulty].label}${mine.levels ? ' · levels matched to your team' : ''}`};
  startVsCpu(foeTeamFor(E.TEAM_TEXT[k], mine.levels), null, mine.sets || mine.text, mine.name);
}

function startVsCpu(foeTeamText, state, playerText, playerName, gameType) {
  mode = 'cpu'; ME = 'p1'; FOE = 'p2'; mem = {};
  setAccent(foe.color);
  let p1name = playerName || 'You';
  if (p1name === foe.name) p1name = 'You';
  const asTeam = t => Array.isArray(t) ? t : E.parseTeam(t).team;
  // doubles and triples need a Mon for every slot: pad a small team with "Nobody" (fainted from the start, never shown)
  const need = gameType === 'triples' ? 3 : gameType === 'doubles' ? 2 : 1;
  const mine = asTeam(playerText).slice();
  while (mine.length < need) mine.push({...mine[0], name: 'Nobody'});
  beginBattle({name: p1name, team: mine}, {name: foe.name, team: asTeam(foeTeamText)}, undefined, gameType);
  if (state) E.applyTeamState(battle.p1, state);
  if (ctx && ctx.kind === 'adventure') applyAdvHP();
  battle.p1.pokemon.forEach(p => { if (p.name === 'Nobody') { p.hp = 0; p.fainted = true; } });
  E.recountLeft(battle.p1);
  $('battleMap').hidden = !(ctx && (ctx.kind === 'journey' || ctx.kind === 'adventure'));
  showLeadScreen();
}

function aiLevel() { return ctx && ctx.kind === 'journey' && J ? J.difficulty : ctx && ctx.kind === 'adventure' && A ? A.difficulty : difficulty; }
function usesBag() { return !!(ctx && (ctx.kind === 'journey' || ctx.kind === 'adventure')); }
function bagNow() { return ctx && ctx.kind === 'adventure' ? A.bag : J.bag; }
function saveBagOwner() { if (ctx && ctx.kind === 'adventure') saveA(); else saveJ(); }

function runAI() {
  const s = battle.p2, r = s.activeRequest;
  if (!r || r.wait || s.isChoiceDone()) return;
  const c = E.aiChoose(battle, 'p2', mem, aiLevel()) || 'default';
  if (!battle.choose('p2', c)) battle.choose('p2', 'default');
}

// ---------- choices ----------
async function commit(choice) {
  if (playing || !battle || battle.ended) return;
  if (mode === 'cpu') {
    runAI();
    if (!battle.choose('p1', choice)) { chooseError(); return; }
    E.recountLeft(battle.p1);
    // the computer may still owe choices (e.g. replacing a fainted Mon)
    await refresh();
    return;
  }
  // online: validate on a scratch check, then record it
  const req = battle[ME].activeRequest;
  if (!req || req.wait || battle[ME].isChoiceDone()) return;
  const ok = battle.choose(ME, choice);
  if (!ok) { chooseError(); return; }
  choices[ME] = [...choices[ME], choice];
  applied[ME] = choices[ME].length;
  renderControls();
  if (match.link) { linkSend({t: 'moves', side: ME, list: choices[ME]}); await refresh(); return; }
  try {
    await db.doc(`matches/${match.id}/moves/${ME}`).set({list: choices[ME], at: Date.now()});
  } catch (e) {
    addLine(e && e.code === 'invalid_argument' ? "Your move couldn't be saved. You need edit access to this page to battle online." : "Your move couldn't be saved. Check your connection and reload the page to continue.", 'bad');
  }
  await refresh();
}

function chooseError() {
  const err = battle[ME].choice && battle[ME].choice.error;
  addLine(err ? esc(err.replace(/^\[.*?\]\s*/, '')) : 'That choice is not allowed right now.', 'bad');
}

// Apply any recorded choices that the local battle hasn't used yet (online)
function applyQueued() {
  let progressed = true;
  while (progressed && !battle.ended) {
    progressed = false;
    for (const s of ['p1', 'p2']) {
      const r = battle[s].activeRequest;
      if (!r || r.wait || battle[s].isChoiceDone()) continue;
      const c = choices[s][applied[s]];
      if (c === undefined) continue;
      applied[s]++;
      if (!battle.choose(s, c)) battle.choose(s, 'default');
      progressed = true;
    }
  }
  if (match && match.data.forfeit && !battle.ended) battle.forceWin(match.data.forfeit === 'p1' ? 'p2' : 'p1');
}

async function refresh() {
  if (!battle) return;
  if (refreshing) { refreshAgain = true; return; }
  refreshing = true;
  try {
    do {
      refreshAgain = false;
      if (mode === 'online') applyQueued();
      else {
        for (let g = 0; g < 10 && !battle.ended; g++) {
          const r1 = battle.p1.activeRequest;
          if (r1 && !r1.wait && !battle.p1.isChoiceDone()) break;
          const before = battle.log.length; runAI();
          if (battle.log.length === before) break;
        }
      }
      await play();
    } while (refreshAgain && battle);
  } finally { refreshing = false; }
  if (!battle) return;
  syncFromState();
  const req = battle[ME].activeRequest;
  if (!battle.ended && req && req.teamPreview && !battle[ME].isChoiceDone()) { showLeadScreen(); return; }
  if (!$('battle').hidden || !$('lead').hidden) show('battle');
  renderControls();
  $('devWin').hidden = !(A && A.dev && ctx && ctx.kind === 'adventure' && !battle.ended);
  if (battle.ended && !resultShown) {
    resultShown = true;
    if (mode === 'online' && match && match.data.status !== 'done') {
      if (match.link) match.data.status = 'done';
      else db.doc('matches/' + match.id).update({status: 'done', winner: battle.winner || ''}).catch(() => {});
    }
    setTimeout(showResult, skip ? 0 : 500);
  }
}

// ---------- log playback ----------
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function play() {
  const lines = battle.log.slice(logIdx);
  logIdx = battle.log.length;
  const events = translate(lines);
  playing = true;
  if (!events.length) { playing = false; return; }
  for (const ev of events) {
    if (ev.before) await ev.before();
    if (ev.apply) ev.apply();
    if (ev.text) addLine(ev.text, ev.cls);
    renderCards();
    if (ev.fx) applyFx(ev.fx);
    if (ev.after) await ev.after();
    if (ev.text && !skip) await sleep(ev.wait || (ev.cls === 'turn' ? 150 : 520));
  }
  playing = false;
  skip = false;
}
$('log').addEventListener('click', () => { skip = true; });

function addLine(text, cls) {
  const p = document.createElement('p');
  if (cls) p.className = cls;
  p.innerHTML = text;
  const log = $('log');
  log.appendChild(p);
  while (log.childNodes.length > 250) log.removeChild(log.firstChild);
  log.scrollTop = log.scrollHeight;
}

function parseHP(str, side) {
  if (!str) return null;
  const [frac, st] = str.split(' ');
  if (frac === '0') return {hp: 0, maxhp: view[side].maxhp || 100, status: 'fnt'};
  const [a, b] = frac.split('/').map(Number);
  return {hp: a, maxhp: b || 100, status: st || ''};
}
function pctOf(side) { const v = view[side]; return v.maxhp ? v.hp / v.maxhp * 100 : 0; }

function translate(lines) {
  const out = [];
  const foeName = foe.name;
  const sideOf = id => (id || '').slice(0, 2);
  const slotOf = id => battle.activePerHalf > 1 ? (id || '').slice(0, 3) : (id || '').slice(0, 2);
  const nick = id => (id || '').split(': ').slice(1).join(': ');

  const teamOf = s => s.startsWith(ME) ? 'your team' : `${esc(foeName)}'s team`;

  for (let i = 0; i < lines.length; i++) {

    if (line.startsWith('|split|')) {

    }
    if (!line || line[0] !== '|') continue;
    const parts = line.slice(1).split('|');
    const cmd = parts[0];
    const id = parts[1];
    const sd = sideOf(id), s = slotOf(id);
    if (id && id.endsWith(': Nobody')) continue;
    switch (cmd) {
      case 'switch': case 'drag': {
        const species = parts[2].split(',')[0];
        const hp = parseHP(parts[3], s);
        out.push({fx: {side: s, kind: 'clear'}, before: (sd !== ME && ctx && ctx.fight && ctx.fight.type === 'champion') ? () => championReveal(species) : null, after: championRevealEnd, apply() { if (ctx && ctx.kind === 'adventure') markSeen(species); view[s] = {ident: id, species, hp: hp.hp, maxhp: hp.maxhp, status: hp.status === 'fnt' ? '' : hp.status, boosts: {}}; },
          text: cmd === 'drag' ? `${Nm(id)} was dragged out!` : sd === ME ? `Go! <span class="key">${esc(nick(id))}</span>!` : foe.wild ? `A wild <span class="key">${esc(nick(id))}</span> appeared!` : `${esc(ownerOf(id))} sent out <span class="key">${esc(nick(id))}</span>!`});
        break;
      }
      case 'replace': {

        out.push({apply() { view[s].species = species; view[s].ident = id; }, text: `The Illusion broke! It was ${sd === ME ? '' : esc(ownerOf(id)) + "'s "}<span class="key">${esc(species)}</span>!`});
        break;
      }
      case 'detailschange': {
        const species = parts[2].split(',')[0];
        out.push({apply() { view[s].species = species; }});
        break;
      }
      case 'move': {
        const extra = parts.slice(4).join(' ');
        if (extra.includes('[still]') && extra.includes('[from]')) break;
        fxType[sd] = E.Dex.moves.get(parts[2]).type || 'Normal';
        out.push({text: `${Nm(id)} used <b>${esc(parts[2])}</b>!`, fx: {side: s, kind: 'act'}});
        break;
      }
      case '-damage': {
        const hp = parseHP(parts[2], s);
        const from = fromTag(parts);
        out.push({fx: from ? null : {side: s, kind: 'hit', color: TYPE_COLORS[fxType[sd === 'p1' ? 'p2' : 'p1']] || '#ffffff'}, apply() {
            const before = pctOf(s);
            view[s].hp = hp.hp; view[s].maxhp = hp.maxhp;
            if (hp.status && hp.status !== 'fnt') view[s].status = hp.status;
            const drop = before - pctOf(s);
            this.lost = drop > 0 ? Math.max(1, Math.round(drop)) : 0;
          },
          get text() { return this.lost === undefined || this.lost === 0 ? '' : `${Nm(id)} lost ${this.lost}% of its health${from ? ` <span class="info">(${esc(from === 'psn' || from === 'tox' ? 'poison' : from === 'brn' ? 'burn' : from)})</span>` : ''}.`; },
          cls: sd === ME ? 'bad' : '', wait: 1000});
        break;
      }
      case '-heal': {
        const hp = parseHP(parts[2], s);
        const from = fromTag(parts);
        out.push({apply() { const before = pctOf(s); view[s].hp = hp.hp; view[s].maxhp = hp.maxhp; const up = pctOf(s) - before; this.gain = up > 0 ? Math.max(1, Math.round(up)) : 0; },
          get text() { return this.gain === undefined ? '' : (this.gain ? `${Nm(id)} restored ${this.gain}% HP${from ? ` <span class="info">(${esc(from)})</span>` : ''}.` : ''); },
          cls: sd === ME ? 'good' : '', wait: 1000});

      }
      case 'faint':
        out.push({fx: {side: s, kind: 'faint'}, apply() { view[s].hp = 0; view[s].status = ''; }, text: `${Nm(id)} fainted!`, cls: sd === ME ? 'bad' : 'good', wait: (sd !== ME && ctx && ctx.fight && ctx.fight.type === 'champion') ? 1800 : 0});
        break;
      case '-supereffective': out.push({text: `It's super effective!`, fx: {side: s, kind: 'shake'}}); break;
      case '-resisted': out.push({text: `It's not very effective…`, cls: 'info'}); break;
      case '-immune': out.push({text: `It doesn't affect ${nm(id)}…`, cls: 'info'}); break;
      case '-crit': out.push({text: `A critical hit!`, fx: {side: s, kind: 'shake'}}); break;
      case '-miss': out.push({text: parts[2] ? `${Nm(parts[2])} avoided the attack!` : `The attack missed!`, cls: 'info'}); break;
      case '-fail': out.push({text: `But it failed!`, cls: 'info'}); break;
      case '-hitcount': out.push({text: `Hit ${esc(parts[2])} time${parts[2] === '1' ? '' : 's'}!`, cls: 'info'}); break;
      case '-status': {
        const st = parts[2];

        out.push({apply() { view[s].status = st; }, text: `${Nm(id)} ${msg}! ${statusPill(st, true)}`,
          fx: {side: s, kind: 'hit', color: STATUS[st] ? STATUS[st][1] : '#ffffff'}});
        break;
      }
      case '-curestatus': {
        const st = parts[2];
        const msg = st === 'slp' ? 'woke up' : st === 'frz' ? 'thawed out' : 'was cured';

      }
      case 'cant': {

        const msg = why === 'slp' ? 'is fast asleep.' : why === 'par' ? "is paralyzed! It can't move!" : why === 'frz' ? 'is frozen solid!' : why === 'recharge' ? 'must recharge!' : why === 'flinch' ? 'flinched!' : "can't move!";

      }

        const adv = n >= 3 ? (up ? 'rose drastically' : 'fell severely') : n === 2 ? (up ? 'rose sharply' : 'harshly fell') : n === 1 ? (up ? 'rose' : 'fell') : (up ? "won't go any higher" : "won't go any lower");
        out.push({apply() { view[s].boosts[stat] = Math.max(-6, Math.min(6, (view[s].boosts[stat] || 0) + (up ? n : -n))); }, text: `${Nm(id)}'s ${STAT_NAMES[stat] || stat} ${adv}!`});
        break;
      }
      case '-weather': {
        const w = parts[1];
        if (line.includes('[upkeep]')) break;
        const msg = {Snowscape: 'It started to snow!', Snow: 'It started to snow!', Hail: 'It started to hail!', SandStorm: 'A sandstorm kicked up!', Sandstorm: 'A sandstorm kicked up!', RainDance: 'It started to rain!', SunnyDay: 'The sunlight turned harsh!', none: 'The weather cleared up.'}[w] || '';

      }
      case '-sidestart': {

        const team = teamOf(parts[1]);
        const msg = {
          'Stealth Rock': `Pointed stones float around ${team}!`, 'Spikes': `Spikes were scattered around ${team}'s feet!`,

          'Aurora Veil': `Aurora Veil made ${team} stronger against attacks!`, 'Reflect': `Reflect raised ${team}'s Defense!`, 'Light Screen': `Light Screen raised ${team}'s Sp. Def!`,

      }
      case '-sideend': {

        break;
      }
      case '-mega': out.push({text: `${Nm(id)} Mega Evolved into <b>Mega ${esc(parts[2])}</b>!`, cls: 'good'}); break;
      case '-enditem': {

        else if (eff === 'confusion') out.push({text: `${Nm(id)} is confused!`, cls: 'info'});
        break;
      }
      case '-start': {
        const eff = (parts[2] || '').replace('move: ', '');
        if (eff === 'Encore') out.push({text: `${Nm(id)} must do an encore!`});
        else if (eff === 'confusion') out.push({text: `${Nm(id)} became confused!`});
        else if (eff === 'Substitute') out.push({text: `${Nm(id)} put in a substitute!`});

      }
      case '-end': {
        const eff = (parts[2] || '').replace('move: ', '');

      case 'win': if (ctx && ctx.fight && (ctx.fight.caught || ctx.fight.finished)) break; out.push({text: parts[1] === battle[ME].name ? 'You won the battle!' : `${esc(foeName)} won the battle!`, cls: parts[1] === battle[ME].name ? 'good' : 'bad'}); break;

      case 'error': out.push({text: esc(parts.slice(1).join(' ')), cls: 'bad'}); break;

// Health bars move smoothly: every change takes 1 second from start to finish.
const hpAnim = {p1: null, p2: null}; // {ident, from, to, t0, dur}
function hpShown(side) {
  const a = hpAnim[side];
  if (!a) return null;
  if (skip || !a.dur) return a.to;
  const k = Math.min(1, (performance.now() - a.t0) / a.dur);
  return a.from + (a.to - a.from) * k;
}
function hpTrack(side, ident, target) {
  const a = hpAnim[side];
  if (!a || a.ident !== ident) { hpAnim[side] = {ident, from: target, to: target, t0: 0, dur: 0}; return target; }
  if (Math.abs(a.to - target) > 0.6) {
    hpAnim[side] = {ident, from: hpShown(side), to: target, t0: performance.now(), dur: skip || reducedMotion() ? 0 : 1000};
    if (!hpRaf) hpRaf = requestAnimationFrame(hpTick);
  }
  return hpShown(side);
}
function hpLabel(side, pct) {
  const v = view[side], a = hpAnim[side], done = !a || hpShown(side) === a.to;
  if (side.slice(0, 2) === ME) return `${done ? Math.max(0, v.hp) : Math.max(0, Math.round(pct * v.maxhp / 100))}/${v.maxhp}`;
  return `${pct > 0 ? Math.max(1, Math.round(pct)) : 0}%`;
}
let hpRaf = 0;
function hpTick() {
  hpRaf = 0;
  let busy = false;
  for (const side of Object.keys(hpAnim)) {
    const a = hpAnim[side];
    if (!a || !view || !view[side]) continue;
    const pct = hpShown(side);
    const el = side.length > 2 ? document.querySelector(`[data-slot="${side}"]`) : $(side === ME ? 'myCard' : 'foeCard');
    if (!el) continue;
    const bar = el.querySelector('.hp i'), txt = el.querySelector('.hptext');
    if (bar) { bar.style.width = pct + '%'; bar.style.backgroundColor = hpColor(pct); }
    if (txt) txt.textContent = hpLabel(side, pct);
    if (pct !== a.to) busy = true;
  }
  if (busy) hpRaf = requestAnimationFrame(hpTick);
}

// One small card per active Mon in doubles and triples. The foe row is mirrored so Mons face each other.

  const sp = E.Dex.species.get(v.species), mine = slot.slice(0, 2) === ME;
  const pct = hpTrack(slot, v.ident, Math.max(0, pctOf(slot)));
  const name = sp.isMega ? 'Mega ' + sp.baseSpecies : sp.name;
  const art = artOf(sp.name);
  const real = battle[slot.slice(0, 2)].active['abc'.indexOf(slot[2])];
  const boosts = Object.entries(v.boosts).filter(([, n]) => n).map(([k, n]) => `<span class="boost ${n > 0 ? 'up' : 'down'}">${STAT_SHORT[k] || k} ${n > 0 ? '+' : ''}${n}</span>`).join('');

function playerInfo() {
  const text = myTeamText();
  const mine = myTeam();
  return {uid: myUid, name: profileName() || baseName(), key: mine.kind === 'gym' ? mine.key : null, color: mine.color || CUSTOM_COLOR, team: text};
}

function newId() {
  const a = 'abcdefghjkmnpqrstuvwxyz23456789';
  let s = ''; for (let i = 0; i < 8; i++) s += a[Math.floor(Math.random() * a.length)];
  return s;
}

async function createMatch() {
  if (!myTeamText()) { needTeam(); return; }
  // close any old open challenge of mine first
  for (const m of matches.filter(m => m.data.p1 && m.data.p1.uid === myUid && m.data.status === 'open')) {
    await db.doc('matches/' + m.id).update({status: 'cancelled'});
  }
  const id = newId();
  const seed = [0, 0, 0, 0].map(() => Math.floor(Math.random() * 0x10000));
  await db.doc('matches/' + id).set({status: 'open', seed, p1: playerInfo(), p2: null, createdAt: Date.now()});
}

async function joinMatch(id) {
  if (!myTeamText()) { needTeam(); return; }
  const ref = db.doc('matches/' + id);
  const lease = await ref.acquire({holder: myUid, ttlMs: 5000});
  if (!lease.acquired) throw {message: 'Someone else is joining that challenge right now.'};
  const snap = await ref.get();
  const d = snap.exists ? snap.data() : null;
  if (!d || d.status !== 'open' || d.p2) throw {message: 'That challenge is no longer open.'};
  const me = playerInfo();
  if (me.name === d.p1.name) me.name = me.name + ' 2';
  await ref.update({p2: me, status: 'active', startedAt: Date.now()});
  openMatch(id, {...d, p2: me, status: 'active'});
}

function openMatch(id, data) {
  if (unsubMoves) unsubMoves();
  if (unsubMatch) unsubMatch();
  mode = 'online';
  match = {id, data};
  ME = data.p1.uid === myUid ? 'p1' : 'p2';
  FOE = ME === 'p1' ? 'p2' : 'p1';
  const opp = data[FOE];
  foe = {name: opp.name, key: opp.key, color: opp.color || CUSTOM_COLOR};
  setAccent(foe.color);
  const t1 = E.parseTeam(data.p1.team).team, t2 = E.parseTeam(data.p2.team).team;
  beginBattle({name: data.p1.name, team: t1}, {name: data.p2.name, team: t2}, data.seed);
  choices = {p1: [], p2: []}; applied = {p1: 0, p2: 0};
  let first = true;
  show('battle');
  $('controls').innerHTML = '<div class="waiting">Loading the battle…</div>';
  unsubMoves = db.collection(`matches/${id}/moves`).onSnapshot(snap => {
    let changed = false;
    for (const d of snap.docs) {
      if (d.id !== 'p1' && d.id !== 'p2') continue;
      const list = (d.data() || {}).list || [];
      // never shrink our own list from a stale snapshot
      if (list.length > choices[d.id].length) { choices[d.id] = list.slice(); changed = true; }
    }
    if (first) { first = false; skip = true; changed = true; }
    if (changed) refresh();
  }, () => addLine('Lost the live connection to this battle. Reload the page to reconnect.', 'bad'));
  unsubMatch = db.doc('matches/' + id).onSnapshot(snap => {
    if (!snap.exists || !match || match.id !== id) return;
    const d = snap.data();
    const hadForfeit = match.data.forfeit;
    match.data = d;
    if (d.forfeit && !hadForfeit) refresh();
  });
}


// ---------- team guide ----------
const STAT_ORDER = ['hp', 'atk', 'def', 'spa', 'spd', 'spe'];
const STAT_LABEL = {hp: 'HP', atk: 'Atk', def: 'Def', spa: 'SpA', spd: 'SpD', spe: 'Spe'};
const ABILITY_IMMUNE = {levitate: 'Ground', waterabsorb: 'Water', dryskin: 'Water', stormdrain: 'Water', voltabsorb: 'Electric', lightningrod: 'Electric', motordrive: 'Electric', flashfire: 'Fire', sapsipper: 'Grass', eartheater: 'Ground'};
let infoKey = null, infoReturn = 'setup';

function calcStats(set, sp) {
  const nat = E.Dex.natures.get(set.nature || 'Serious');
  const L = set.level || 100, out = {};
  for (const s of STAT_ORDER) {
    const b = sp.baseStats[s], iv = set.ivs && set.ivs[s] != null ? set.ivs[s] : 31, ev = set.evs && set.evs[s] || 0;
    const core = Math.floor((2 * b + iv + Math.floor(ev / 4)) * L / 100);
    if (s === 'hp') out[s] = sp.baseStats.hp === 1 ? 1 : core + L + 10;
    else out[s] = Math.floor((core + 5) * (nat.plus === s ? 1.1 : nat.minus === s ? 0.9 : 1));
  }
  return {stats: out, nat};
}

function matchups(types, abilityId) {
  const groups = {};
  for (const t of E.Dex.types.names()) {
    if (t === 'Stellar') continue;
    let m = 1;
    for (const dt of types) m *= E.Dex.getImmunity(t, dt) ? Math.pow(2, E.Dex.getEffectiveness(t, dt)) : 0;
    if (ABILITY_IMMUNE[abilityId] === t) m = 0;
    if (abilityId === 'thickfat' && (t === 'Fire' || t === 'Ice')) m *= 0.5;
    if (abilityId === 'dryskin' && t === 'Fire') m *= 1.25;
    if (m === 1) continue;
    (groups[m] = groups[m] || []).push(t);
  }
  const rows = [[4, '4×', 'w'], [2.5, '2.5×', 'w'], [2, '2×', 'w'], [0.5, '½×', 'r'], [0.25, '¼×', 'r'], [0.125, '⅛×', 'r'], [0, 'None', 'i']];
  return rows.filter(([m]) => groups[m]).map(([m, label, cls]) => `<div><span class="k ${cls}">${label}</span>${typesHTML(groups[m])}</div>`).join('');
}

function statBlock(set, sp, title) {
  const {stats, nat} = calcStats(set, sp);
  const rows = STAT_ORDER.map(s => {
    const cls = nat.plus === s ? 'plus' : nat.minus === s ? 'minus' : '';
    const w = Math.min(100, stats[s] / (s === 'hp' ? 450 : 420) * 100);
    return `<span class="s ${cls}">${STAT_LABEL[s]}</span><span class="v">${stats[s]}</span><span class="bar" title="Base ${sp.baseStats[s]}"><i style="width:${w}%"></i></span>`;
  }).join('');
  const base = STAT_ORDER.map(s => `${STAT_LABEL[s]} ${sp.baseStats[s]}`).join(' · ');
  return `<div><div class="lbl">${esc(title)}</div><div class="statgrid">${rows}</div><div class="statnote">Base stats: ${base} (total ${STAT_ORDER.reduce((a, s) => a + sp.baseStats[s], 0)})</div></div>`;
}

function dexCard(set, idx) {
  const sp = E.Dex.species.get(set.species);
  const item = set.item ? E.Dex.items.get(set.item) : null;
  const ab = E.Dex.abilities.get(set.ability);
  const nat = E.Dex.natures.get(set.nature || 'Serious');
  const evs = STAT_ORDER.filter(s => set.evs && set.evs[s]).map(s => `${set.evs[s]} ${STAT_LABEL[s]}`).join(' / ') || 'None';
  const natTxt = nat.plus ? `${nat.name} (+${STAT_LABEL[nat.plus]}, −${STAT_LABEL[nat.minus]})` : `${nat.name} (no stat change)`;
  let mega = '';
  if (item && item.megaStone) {
    const megaName = typeof item.megaStone === 'string' ? item.megaStone : Object.values(item.megaStone)[0];
    const msp = E.Dex.species.get(megaName);
    if (msp.exists) {
      const mab = E.Dex.abilities.get(msp.abilities[0]);
      mega = `<div class="kv"><div class="lbl">Mega Evolution</div>
        <p><b>Mega ${esc(msp.baseSpecies)}</b> ${typesHTML(msp.types)}</p>
        <p><b>${esc(mab.name)}:</b> <span>${esc(mab.shortDesc || mab.desc)}</span></p></div>
        ${statBlock(set, msp, 'Stats after Mega Evolving')}
        <div><div class="lbl">Weaknesses after Mega Evolving</div><div class="mults">${matchups(msp.types, mab.id)}</div></div>`;
    }
  }
  const moves = set.moves.map(m => {
    const mv = E.Dex.moves.get(m);
    const acc = mv.accuracy === true ? 'Never misses' : `${mv.accuracy}% acc`;
    const pow = mv.category === 'Status' ? 'Status' : `${mv.category} · ${mv.basePower ? mv.basePower + ' power' : 'varies'}`;
    const pp = Math.floor(mv.pp * 8 / 5);
    const pri = mv.priority ? ` · Priority ${mv.priority > 0 ? '+' : ''}${mv.priority}` : '';
    return `<div class="mv" style="--t:${TYPE_COLORS[mv.type] || '#999'}"><div class="top"><b>${esc(mv.name)}</b>${typesHTML([mv.type])}</div>
      <div class="nums">${esc(pow)} · ${esc(acc)} · ${pp} PP${pri}</div><p>${esc(mv.shortDesc || mv.desc)}</p></div>`;
  }).join('');
  return `<details class="dex" ${idx === 0 ? 'open' : ''}>
    <summary><span class="nm">${esc(sp.name)}</span><span class="chev"></span>
      <span class="sub">${typesHTML(sp.types)} ${item ? '· ' + esc(item.name) : ''} · ${esc(ab.name)}</span></summary>
    <div class="dexbody">
      <div class="kv"><div class="lbl">Held item</div><p><b>${item ? esc(item.name) : 'None'}</b>${item ? ': <span>' + esc(item.shortDesc || item.desc) + '</span>' : ''}</p></div>
      <div class="kv"><div class="lbl">Ability</div><p><b>${esc(ab.name)}:</b> <span>${esc(ab.shortDesc || ab.desc)}</span></p></div>
      <div class="kv"><div class="lbl">Nature and training</div><p><b>${esc(natTxt)}</b></p><p><span>EVs: ${esc(evs)} · Level ${set.level || 100}</span></p></div>
      ${statBlock(set, sp, 'Stats at level ' + (set.level || 100))}
      <div><div class="lbl">Moves</div><div class="mvlist">${moves}</div></div>
      <div><div class="lbl">Damage taken by type</div><div class="mults">${matchups(sp.types, ab.id)}</div></div>
      ${mega}
    </div></details>`;
}

function runGauntletStage() {

function mapPoints() {
  const pts = [{x: 180, y: 688}];
  const cols = [62, 180, 298];
  for (let i = 0; i < 18; i++) {
    const row = Math.floor(i / 3), c = i % 3, col = row % 2 ? 2 - c : c;
    pts.push({x: cols[col] + ((i * 37) % 21 - 10), y: 598 - row * 106 + ((i * 53) % 17 - 8)});
  }
  return pts; // pts[0] = home, pts[1..17] = gyms in journey order, pts[18] = Victory Summit
}
function segCtrl(a, b, i) {
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  const vertical = Math.abs(a.y - b.y) > 50;
  return {x: vertical ? mx + (a.x < 180 ? -42 : 42) : mx, y: vertical ? my : my + (i % 2 ? 26 : -26)};
}
function segPath(a, b, i) {
  const c = segCtrl(a, b, i);
  return `M${a.x} ${a.y} Q${c.x} ${c.y} ${b.x} ${b.y}`;
}
function rng(seed) { let s = seed; return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }
let terrainCache = null;
function terrain(pts) {
  if (terrainCache) return terrainCache;
  const r = rng(20261018);
  // keep scenery off the towns, their name labels and the road
  const road = [];
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i], c = segCtrl(a, b, i);
    for (let t = 0; t <= 1; t += 0.05) road.push({x: (1 - t) * (1 - t) * a.x + 2 * (1 - t) * t * c.x + t * t * b.x, y: (1 - t) * (1 - t) * a.y + 2 * (1 - t) * t * c.y + t * t * b.y});
  }
  const far = (x, y, d) => pts.every(p => Math.hypot(p.x - x, p.y - y) > d && !(Math.abs(p.x - x) < 52 && y > p.y && y < p.y + 52))
    && road.every(q => Math.hypot(q.x - x, q.y - y) > 16);
  let out = '';
  // sea along the right edge and a few lakes
  out += `<path d="M360 0 C330 80 345 160 322 240 C300 330 340 420 318 520 C300 600 336 660 360 720Z" fill="#17304a"/>`;
  for (let i = 0; i < 4; i++) {
    const x = 30 + r() * 280, y = 40 + r() * 600;
    if (far(x, y, 46)) out += `<ellipse cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" rx="${(18 + r() * 16).toFixed(0)}" ry="${(10 + r() * 8).toFixed(0)}" fill="#1b3550"/>`;
  }
  for (let i = 0; i < 60; i++) {
    const x = 10 + r() * 330, y = 20 + r() * 660;
    if (!far(x, y, 34)) continue;
    if (r() < 0.4) {
      const h = 12 + r() * 10;
      out += `<path d="M${(x - h * .7).toFixed(1)} ${y.toFixed(1)} L${x.toFixed(1)} ${(y - h).toFixed(1)} L${(x + h * .7).toFixed(1)} ${y.toFixed(1)}Z" fill="#2b3442"/><path d="M${(x - h * .22).toFixed(1)} ${(y - h * .68).toFixed(1)} L${x.toFixed(1)} ${(y - h).toFixed(1)} L${(x + h * .22).toFixed(1)} ${(y - h * .68).toFixed(1)}Z" fill="#53606f"/>`;
    } else {

function renderWorldMap(markerIdx, S, overlay = '') {
  const pts = mapPoints();
  const st = S.stage();
  const curStop = S.done ? 18 : Math.min(S.pos, 17) + 1; // index into pts of the place you're headed
  let svg = `<rect width="360" height="720" fill="#141c26"/>` + terrain(pts);
  // route
  for (let i = 1; i < pts.length; i++) {
    const done = i <= curStop;
    svg += `<path id="seg-${i}" d="${segPath(pts[i - 1], pts[i], i)}" fill="none" stroke="${done ? '#c9d3e3' : '#3a4658'}" stroke-width="${done ? 3 : 2.5}" ${done ? '' : 'stroke-dasharray="5 6"'} stroke-linecap="round"/>`;
  }
  // home
  const h = pts[0];
  svg += `<path d="M${h.x - 11} ${h.y + 7} V${h.y - 3} L${h.x} ${h.y - 12} L${h.x + 11} ${h.y - 3} V${h.y + 7}Z" fill="#c9d3e3"/><text x="${h.x}" y="${h.y + 24}" text-anchor="middle" font-size="10" fill="#95a0b2">${HOME}</text>`;
  // towns
  for (let i = 0; i < 17; i++) {

    if (current) svg += `<circle class="ringpulse" cx="${p.x}" cy="${p.y}" r="24" fill="none" stroke="${L.color}" stroke-width="2"/>`;
    svg += `<circle cx="${p.x}" cy="${p.y}" r="17" fill="${cleared ? L.color : '#1d2633'}" stroke="${cleared || current ? L.color : '#3a4658'}" stroke-width="${current ? 3 : 2}"/>`;
    svg += emblemAt(L.icon, cleared ? '#10131a' : current ? L.color : '#56616f', p.x, p.y, 20);
    svg += `<text x="${p.x}" y="${p.y + 31}" text-anchor="middle" font-size="10" font-weight="${current ? 700 : 500}" fill="${current ? '#e9edf3' : cleared ? '#b4bdcb' : '#677286'}">${TOWNS[k]}</text>`;
  }

  const lg = pts[18], inLeague = S.pos >= 17;

  svg += `<circle cx="${lg.x}" cy="${lg.y}" r="19" fill="${S.done ? CHAMP.color : '#1d2633'}" stroke="${inLeague ? CHAMP.color : '#3a4658'}" stroke-width="${inLeague ? 3 : 2}"/>`;
  svg += emblemAt('crown', S.done ? '#10131a' : inLeague ? CHAMP.color : '#56616f', lg.x, lg.y, 22);

  svg += overlay; overlay = '';

  const m = pts[markerIdx];

  svg += overlay;

function animateMarker(segIdx, done) {
  const path = $('mapSvg').querySelector(`#seg-${segIdx}`), mk = $('mapSvg').querySelector('#marker');
  if (!path || !mk || reducedMotion()) { done && done(); return; }
  const len = path.getTotalLength(), t0 = performance.now(), dur = 1500;
  const step = t => {
    const k = Math.min(1, (t - t0) / dur), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    const pt = path.getPointAtLength(e * len);
    mk.setAttribute('transform', `translate(${pt.x} ${pt.y})`);
    scrollMapTo(pt.y);
    if (k < 1) requestAnimationFrame(step); else done && done();
  };
  requestAnimationFrame(step);
}

}

}

// A family fight's Mons: each trainer's strongest (by total base stats), plus any Mon they must bring.
function e4Team(g, lv) {
  const sets = [], owners = {};
  g.members.forEach((k, i) => {
    const text = E.TEAM_TEXT[k], base = E.parseTeam(text).team, lvl = E.leaderSets(text, lv);
    const total = j => Object.values(E.Dex.species.get(base[j].species).baseStats).reduce((a, b) => a + b, 0);
    const order = base.map((_, j) => j).sort((a, b) => total(b) - total(a) || a - b);
    const must = g.must[k] ? base.findIndex(b => b.species === g.must[k]) : -1;
    const pick = (must >= 0 ? [must] : []).concat(order.filter(j => j !== must)).slice(0, g.picks[i]);
    pick.sort((a, b) => a - b);
    for (const j of pick) { sets.push(lvl[j]); owners[lvl[j].species] = LEADERS[k].first; }
  });
  return {sets, owners};
}
async function e4Talk(g, which) {
  for (const [k, line] of E4_TALK[g.key][which]) await talk({name: LEADERS[k].title, key: k, color: LEADERS[k].color}, [line]);
}
// the first two gyms are shorter (2 fewer Mons, then 1 fewer); the ones matching the gym's type are kept, weakest others go first
function gymSets(key, pos, lv) {
  const sets = E.leaderSets(E.TEAM_TEXT[key], lv);
  const drop = pos === 0 ? 2 : pos === 1 ? 1 : 0;
  if (!drop) return sets;
  const type = LEADERS[key].type;
  const rank = sets.map((set, i) => { const sp = E.Dex.species.get(set.species); return {i, match: sp.types.includes(type) ? 1 : 0, bst: Object.values(sp.baseStats).reduce((x, y) => x + y, 0)}; });
  const out = rank.sort((x, y) => (x.match - y.match) || (x.bst - y.bst)).slice(0, drop).map(x => x.i);
  return sets.filter((_, i) => !out.includes(i));
}

       subtitle: st.kind === 'e4' ? `Elite Four ${A.e4pos + 1} of 4 · level ${lv}` : `${TOWNS[st.key]} · ${LEADERS[st.key].badge} · level ${lv}`};
  advFight({type: st.kind, stage: st, level: lv, sets, foe: f, speaker: sp});

// --- moves, level-ups and evolution ---
function ensureMoves(m) {
  if (!Array.isArray(m.moves) || !m.moves.length) m.moves = E.startingMoves(m.final, m.level, m.tutored || []);
  return m.moves;
}
function mset(m) { ensureMoves(m); return E.setAtLevel(m.final, m.level, {tutored: m.tutored, moves: m.moves, noItem: true}); }
function moveCardHTML(name, tag, extraClass, attrs) {
  const mv = E.moveInfo(name);
  const bits = [mv.category, mv.power ? `Power ${mv.power}` : '', mv.accuracy ? `Accuracy ${mv.accuracy}%` : 'Never misses', `Max PP ${mv.pp}`].filter(Boolean).join(' · ');
  return `<${tag} class="mvcard ${extraClass || ''}" style="--t:${TYPE_COLORS[mv.type] || '#999'}" ${attrs || ''}><div class="top"><b>${esc(mv.name)}</b>${typesHTML([mv.type])}</div><small>${esc(bits)}</small><small>${esc(mv.desc || '')}</small></${tag}>`;
}
// Ask which move to forget. Resolves with the forgotten move's name, or null to skip the new move.
function chooseMove(m, newMove, opts = {}) {
  return new Promise(resolve => {
    const box = $('learnBox'), name = mset(m).species;
    let pick = null;
    const draw = () => {
      box.innerHTML = `<h3>${esc(name)} wants to learn ${esc(newMove)}</h3>
        <p>${esc(name)} already knows four moves. ${esc(opts.note || 'Pick one to forget, or skip the new move.')}</p>
        <div class="learnlbl">New move</div>${moveCardHTML(newMove, 'div', 'newmv')}
        <div class="learnlbl">Forget which move?</div>
        ${m.moves.map((mv, i) => moveCardHTML(mv, 'button', pick === i ? 'armed' : '', `type="button" data-forget="${i}" id="forget-${i}" aria-pressed="${pick === i}"`)).join('')}
        <div class="row" style="justify-content:center;margin-top:10px">
          ${pick != null ? `<button class="btn primary" id="learnYes">Forget ${esc(m.moves[pick])}, learn ${esc(newMove)}</button>` : ''}
          <button class="btn" id="learnNo">${esc(opts.cancel || `Don't learn ${newMove}`)}</button></div>`;
    };
    const done = v => { $('learn').hidden = true; box.onclick = null; resolve(v); };
    box.onclick = e => {
      const f = e.target.closest('[data-forget]');
      if (f) { pick = pick === +f.dataset.forget ? null : +f.dataset.forget; draw(); const y = $('learnYes'); if (y) y.scrollIntoView({block: 'nearest'}); return; }
      if (e.target.id === 'learnNo') done(null);
      else if (e.target.id === 'learnYes') { const old = m.moves[pick]; m.moves[pick] = newMove; done(old); }
    };
    draw();
    $('learn').hidden = false;
  });
}

// ---- evolution spectacle ----
let evoSound = store.get('evoSound', true);
let audio = null;
let toneMuted = false;
function tone(freq, t0, dur, type = 'triangle', vol = .12) {
  if (!evoSound || !audio || toneMuted) return;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0, audio.currentTime + t0);
  g.gain.linearRampToValueAtTime(vol, audio.currentTime + t0 + .02);
  g.gain.exponentialRampToValueAtTime(.0001, audio.currentTime + t0 + dur);
  o.connect(g).connect(audio.destination);
  o.start(audio.currentTime + t0); o.stop(audio.currentTime + t0 + dur + .05);
}
function sfxCharge(sec) {
  const notes = [0, 4, 7, 12];
  let t = 0, step = .28, k = 0;
  while (t < sec) { tone(330 * Math.pow(2, (notes[k % 4] + 12 * Math.floor(k / 8)) / 12), t, .22, 'triangle', .07); t += step; step = Math.max(.07, step * .93); k++; }
}
function sfxReveal() {
  [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .09, .35, 'square', .05));
  [523, 659, 784, 1047, 1319].forEach(f => tone(f, .45, 1.6, 'triangle', .06));
  tone(130, 0, .8, 'sine', .25);
}
function sfxPop() { tone(600 + Math.random() * 900, 0, .15, 'sine', .04); }
function updateSoundBtn() { $('evoSound').textContent = evoSound ? 'Sound on' : 'Sound off'; }
$('evoSound').addEventListener('click', () => { evoSound = !evoSound; store.set('evoSound', evoSound); updateSoundBtn(); });

const fx = {parts: [], raf: 0, mode: 'idle', colors: ['#fff'], spawnT: 0, fireT: 0};
function fxResize() { const c = $('evoCanvas'), d = Math.min(2, devicePixelRatio || 1); c.width = innerWidth * d; c.height = innerHeight * d; c.getContext('2d').setTransform(d, 0, 0, d, 0, 0); }
function fxCenter() { const o = document.querySelector('#evo .orb'); if (!o) return {x: innerWidth / 2, y: innerHeight * .42}; const r = o.getBoundingClientRect(); return {x: r.left + r.width / 2, y: r.top + r.height / 2}; }
function burst(x, y, n, speed, conf) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = speed * (.35 + Math.random());
    fx.parts.push({x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - (conf ? 2 : 0), life: 0, max: 60 + Math.random() * 70, size: conf ? 4 + Math.random() * 5 : 1.5 + Math.random() * 2.5,
      color: fx.colors[i % fx.colors.length], conf, rot: Math.random() * 6, vr: (Math.random() - .5) * .4, g: conf ? .09 : .03, drag: conf ? .985 : .96});
  }
}
function fxLoop() {
  const c = $('evoCanvas'), ctx2 = c.getContext('2d'), W = innerWidth, H = innerHeight, ctr = fxCenter();
  ctx2.clearRect(0, 0, W, H);
  if (fx.mode === 'charge') {
    for (let k = 0; k < 4; k++) {
      const a = Math.random() * Math.PI * 2, r = Math.max(W, H) * (.45 + Math.random() * .3);
      const x = ctr.x + Math.cos(a) * r, y = ctr.y + Math.sin(a) * r;
      fx.parts.push({x, y, vx: 0, vy: 0, life: 0, max: 200, size: 1.5 + Math.random() * 2.5, color: fx.colors[k % fx.colors.length], spiral: true, a, r, sp: .012 + Math.random() * .02});
    }
  }
  if (fx.mode === 'party' && ++fx.fireT % 38 === 0) {
    const x = W * (.15 + Math.random() * .7), y = H * (.12 + Math.random() * .35);
    burst(x, y, 60, 5, false); sfxPop();
  }
  if (fx.mode === 'party' && fx.fireT % 6 === 0) {
    fx.parts.push({x: Math.random() * W, y: -10, vx: (Math.random() - .5) * 1.5, vy: 1 + Math.random() * 2, life: 0, max: 400, size: 5 + Math.random() * 5, color: fx.colors[Math.floor(Math.random() * fx.colors.length)], conf: true, rot: Math.random() * 6, vr: (Math.random() - .5) * .3, g: .03, drag: .995});
  }
  fx.parts = fx.parts.filter(p => p.life < p.max && p.y < H + 40);
  for (const p of fx.parts) {
    p.life++;
    if (p.spiral) {
      p.r *= 0.955; p.a += p.sp * 6;
      p.x = ctr.x + Math.cos(p.a) * p.r; p.y = ctr.y + Math.sin(p.a) * p.r;
      if (p.r < 30) p.life = p.max;
    } else { p.vx *= p.drag; p.vy = p.vy * p.drag + p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr || 0; }
    const fade = 1 - p.life / p.max;
    ctx2.globalAlpha = p.conf ? Math.min(1, fade * 2) : fade;
    ctx2.fillStyle = p.color;
    if (p.conf) {
      ctx2.save(); ctx2.translate(p.x, p.y); ctx2.rotate(p.rot); ctx2.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); ctx2.restore();
    } else {
      ctx2.globalCompositeOperation = 'lighter';
      ctx2.beginPath(); ctx2.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx2.fill();
      ctx2.globalAlpha *= .25; ctx2.beginPath(); ctx2.arc(p.x, p.y, p.size * 3, 0, Math.PI * 2); ctx2.fill();

}
const wait = ms => new Promise(r => setTimeout(r, ms));
function evoColors(types) { const c = types.map(t => TYPE_COLORS[t] || '#9ad'); return [c[0], c[1] || c[0]]; }
function setEvoColors(types) { const [a, b] = evoColors(types); const el = $('evo'); el.style.setProperty('--c1', a); el.style.setProperty('--c2', b); }

async function evolveScene(m, ev) {
  const el = $('evo'), stage = $('evoStage');
  const before = E.statsAt(m.final, m.level, m.moves, ev.from), after = E.statsAt(m.final, m.level, m.moves, ev.to);
  const reduce = reducedMotion();
  let skipped = false;
  el.className = 'evo'; setEvoColors(before.types);
  updateSoundBtn();
  fx.parts = []; fx.mode = 'idle'; fx.colors = ['#ffffff', ...evoColors(before.types)];
  fxResize(); addEventListener('resize', fxResize);
  el.hidden = false;
  if (!reduce) fx.raf = requestAnimationFrame(fxLoop);
  // 1. intro
  stage.innerHTML = `<div class="orb"><span class="glyph">${artOf(ev.from) || '?'}</span></div><div class="ename" id="evoName">${esc(ev.from)}</div><div class="eline">What? ${esc(ev.from)} is evolving!</div><div class="row"><button class="btn primary" id="evoGo">Watch!</button></div>`;
  $('evoSkip').hidden = true;
  await new Promise(r => { $('evoGo').onclick = r; $('evoGo').focus(); });
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === 'suspended') audio.resume(); } catch (e) { audio = null; }
  $('evoSkip').hidden = false;
  const skipP = new Promise(r => { $('evoSkip').onclick = () => { skipped = true; r(); }; });
  // 2. charge
  if (!reduce) {
    stage.querySelector('.row').remove();
    stage.querySelector('.eline').textContent = `${ev.from} is glowing…`;
    el.classList.add('charging'); fx.mode = 'charge';
    const total = 4200; sfxCharge(total / 1000);
    const name = $('evoName'), glyph = stage.querySelector('.glyph');
    const flick = (async () => {
      let t = 0, gap = 420, alt = false;
      while (t < total && !skipped) {
        alt = !alt;
        name.textContent = alt ? ev.to : ev.from;
        setEvoColors(alt ? after.types : before.types);
        el.style.setProperty('--beat', Math.max(.12, gap / 1000) + 's');
        glyph.innerHTML = artOf(alt ? ev.to : ev.from) || (alt ? '!' : '?');
        await wait(gap); t += gap; gap = Math.max(55, gap * .86);
      }
    })();
    await Promise.race([flick, skipP]);
  }
  // 3. flash + reveal
  skipped = true;
  $('evoSkip').hidden = true;
  setEvoColors(after.types);
  fx.colors = ['#ffffff', '#ffe27a', '#ffb300', ...evoColors(after.types), ...evoColors(after.types)];
  fx.parts = fx.parts.filter(p => !p.spiral);
  const fl = $('evoFlash'); fl.classList.remove('go'); void fl.offsetWidth; fl.classList.add('go');
  el.classList.remove('charging'); el.classList.add('reveal', 'quake');
  sfxReveal();
  const lbl = {hp: 'HP', atk: 'Atk', def: 'Def', spa: 'Sp. Atk', spd: 'Sp. Def', spe: 'Speed'};
  stage.innerHTML = `<div class="banner">Congratulations!</div><div class="orb"><span class="glyph">${artOf(ev.to) || '★'}</span></div><div class="ename">${esc(ev.to)}</div>
    <div class="eline">Your ${esc(ev.from)} evolved into ${esc(ev.to)}!</div>${typesHTML(after.types)}
    <div class="estats">${Object.keys(lbl).map(k => `<span>${lbl[k]} <b>${after.stats[k] - before.stats[k] > 0 ? '+' : ''}${after.stats[k] - before.stats[k]}</b></span>`).join('')}</div>
    <div class="row"><button class="btn primary" id="evoDone">Awesome!</button></div>`;
  if (!reduce) {
    await wait(30);
    const c = fxCenter();
    burst(c.x, c.y, 160, 11, false); burst(c.x, c.y, 120, 9, true);
    fx.mode = 'party'; fx.fireT = 0;
    setTimeout(() => { const c2 = fxCenter(); burst(c2.x, c2.y, 90, 8, true); }, 450);
  }
  setTimeout(() => el.classList.remove('quake'), 600);
  $('evoDone').focus();

// Level the team up by n, playing evolutions and asking about moves. Returns summary lines.
// Show what happened to the team: XP, level-ups, evolutions and new moves. Returns lines for the result box.
async function showGrowth(events) {
  const lines = [];
  for (const ev of events) {
    const m = A.team[ev.slot];
    if (ev.type === 'xp') { if (ev.gained > 0) lines.push(`XP|${ev.species}|${ev.gained}`); continue; }
    if (ev.type === 'grew') lines.push(`${ev.species} grew to level ${ev.level}.`);
    else if (ev.type === 'evolve') { await evolveScene(m, ev); lines.push(`${ev.from} evolved into ${ev.to}!`); }
    else if (ev.type === 'learned') lines.push(`${ev.species} learned ${ev.move}!`);
    else if (ev.type === 'wants') {
      if (m.moves.includes(ev.move)) continue;
      const old = await chooseMove(m, ev.move);
      lines.push(old ? `${ev.species} forgot ${old} and learned ${ev.move}!` : `${ev.species} did not learn ${ev.move}.`);
    }
    saveA();
  }
  saveA();
  return lines;
}
// XP for the fight that was just won (call while the battle still exists). Team Mons that were sent out get full XP,
// the rest of the team half, and Mons on the Farm none.
const XP_KIND = {gym: 'gym', e4: 'gym', champion: 'gym', route: 'wild', labWild: 'wild', okla: 'gym', train: 'wild', questWild: 'wild', shamburg: 'trainer', trailTrainer: 'trainer', trailWild: 'wild', questTrainer: 'trainer', questLegend: 'legend'};
function awardFightXP(fight) {
  if (fight.type === 'questLegend' && !fight.caught) return [];
  const parts = E.participantsFromLog(battle.log, ctx.names);
  A.team.forEach(ensureMoves);
  // everything on the Laurel Pass (its road, wild Mons and legendary sites) gives double XP
  const trail = fight.type === 'trailTrainer' || fight.type === 'trailWild' || (fight.quest != null && fight.quest >= LEG0);
  const cfg = trail ? {...E.XP, base: Object.fromEntries(Object.entries(E.XP.base).map(([k, v]) => [k, v * 2]))} : E.XP;
  const events = E.awardXP(A.team, parts, XP_KIND[fight.type] || 'wild', fight.sets.map(x => x.level), cfg);
  saveA();
  return events;
}

function summaryHTML(lines) {
  const xp = lines.filter(l => l.startsWith('XP|')).map(l => l.split('|'));
  const other = lines.filter(l => !l.startsWith('XP|'));
  const out = [];
  if (xp.length) out.push(`<p>${xp.map(([, n, g]) => `${esc(n)} +${g} XP`).join(' · ')}</p>`);
  for (const l of other) out.push(`<p class="${l.includes('evolved') ? 'evoline' : 'new'}">${esc(l)}</p>`);
  return `<div class="summary">${out.join('')}</div>`;
}
function advResult(icon, color, title, text, lines, buttons) {
  battleOff();
  $('result').innerHTML = `${emblem(icon, color)}<h3>${esc(title)}</h3><p>${text}</p>${lines && lines.length ? summaryHTML(lines) : ''}<div class="row" style="justify-content:center">${buttons}</div>`;
  $('overlay').hidden = false;
}

async function advBattleOver(won) {
  const fight = ctx.fight;
  readAdvHP();
  saveA();
  if (!won) {
    advHealAll(); A.loc = null; A.townAt = null;
    if (fight.type === 'e4' || fight.type === 'champion') A.e4pos = 0;
    if (fight.quest != null) A.quests[fight.quest].step = 0;
    if (fight.sham != null) A.shamburg.step[fight.sham] = 0;
    saveA();
    advResult(fight.foe.icon || 'star', fight.foe.color, 'You blacked out',
      `Your team was rushed to the Mon Center and fully healed. ${fight.sham != null ? 'Team Shamburg is waiting, and you have to beat them again from the first trainer.' : fight.quest != null ? 'The side quest starts over from the entrance.' : fight.type === 'e4' || fight.type === 'champion' ? 'The Elite Four must be faced again from the start.' : 'Train up and try again.'}`,

// --- Laurel Pass (opens after the 17th badge) ---
// Laurel Pass is a map like the towns and side quests: a winding road with its 5 trainers on it, and the six legendary sites beside it.
// The road has 11 stops from the entrance up: the sites sit at the even stops, the trainers at the odd ones.
const TRAIL_H = 840;
function trailPts() {
  const slots = Array.from({length: 11}, (_, i) => ({x: 180 + 78 * Math.sin(i * 0.95 + 0.4), y: TRAIL_H - 70 - i * 66}));
  const road = TRAIL_TRAINERS.map((_, i) => slots[i * 2 + 1]);
  const sites = AREAS.slice(LEG0, MISS).map((_, k) => {
    const r = slots[k * 2], left = r.x > 180;
    return {x: left ? 52 : 308, y: r.y - 14, rx: r.x, ry: r.y};
  });
  return {slots, road, sites};
}
function openTrail() {
  if (!trailOpen()) { openAdvMap({}); return; }
  mapMode = 'adventure';
  setAccent('#e8c76a');
  const T = A.trail, doneT = TRAIL_TRAINERS.filter((_, i) => T.t[i]).length;
  const doneL = AREAS.slice(LEG0, MISS).filter((a, k) => (A.quests[LEG0 + k] || {}).done).length;
  $('trailSub').textContent = `${doneT} of ${TRAIL_TRAINERS.length} trainers · ${doneL} of 6 legendary Mons · ${money(A.money)}`;
  const {slots, road, sites} = trailPts();
  const gold = '#e8c76a';
  const nextT = TRAIL_TRAINERS.findIndex((_, i) => !T.t[i]);
  const nextL = AREAS.slice(LEG0, MISS).findIndex((_, k) => legendUnlocked(LEG0 + k) && !(A.quests[LEG0 + k] || {}).done);
  const r = rng(77);
  let svg = `<rect width="360" height="${TRAIL_H}" fill="color-mix(in srgb, ${gold} 9%, #121820)"/>`;
  for (let k = 0; k < 70; k++) {
    const x = 8 + r() * 344, y = 8 + r() * (TRAIL_H - 16);
    if (road.some(p => Math.hypot(p.x - x, p.y - y) < 46) || sites.some(p => Math.hypot(p.x - x, p.y - y) < 46)) continue;
    svg += `<path d="M${(x - 9).toFixed(0)} ${y.toFixed(0)} L${x.toFixed(0)} ${(y - 14).toFixed(0)} L${(x + 9).toFixed(0)} ${y.toFixed(0)}Z" fill="${gold}" opacity=".12"/>`;
  }
  // the road: entrance at the bottom, the way on to the Elite Four at the top
  const pts = [{x: 180, y: TRAIL_H - 20}, ...slots];
  const roadD = pts.map((p, i) => (i ? 'L' : 'M') + p.x.toFixed(0) + ' ' + p.y.toFixed(0)).join(' ');
  svg += `<path d="${roadD}" fill="none" stroke="#2a3340" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>`;
  svg += `<path d="${roadD}" fill="none" stroke="#56616f" stroke-width="2.5" stroke-dasharray="6 7" stroke-linecap="round" stroke-linejoin="round"/>`;
  svg += `<text x="180" y="${TRAIL_H - 4}" text-anchor="middle" font-size="11" fill="#b4bdcb">Entrance</text>`;
  svg += `<text x="${slots[10].x}" y="${slots[10].y - 34}" text-anchor="middle" font-size="11" fill="#b4bdcb">On to ${esc(LEAGUE)}</text>`;

    svg += `<g data-tq="${i}" style="cursor:${open ? 'pointer' : 'default'}" ${open ? '' : 'opacity=".55"'}>`;
    if (cur) svg += `<circle class="ringpulse" cx="${p.x}" cy="${p.y}" r="28" fill="none" stroke="${ar.color}" stroke-width="2"/>`;
    svg += `<circle cx="${p.x}" cy="${p.y}" r="26" fill="transparent"/><rect x="${p.x - 13}" y="${p.y - 13}" width="26" height="26" rx="4" transform="rotate(45 ${p.x} ${p.y})" fill="${done || !open ? '#1d2633' : ar.color}" stroke="${open ? ar.color : '#3a4658'}" stroke-width="2.5"/>`;
    svg += done ? `<path d="M${p.x - 5} ${p.y} l4 4 l7 -8" stroke="${ar.color}" stroke-width="2.5" fill="none"/>` : `<text x="${p.x}" y="${p.y + 5}" text-anchor="middle" font-size="14" font-weight="800" fill="${open ? '#10131a' : '#56616f'}">${open ? '!' : '?'}</text>`;
    svg += `<text x="${p.x}" y="${p.y + 36}" text-anchor="middle" font-size="10.5" font-weight="${cur ? 700 : 500}" fill="${cur ? '#e9edf3' : '#95a0b2'}">${esc(ar.name)}</text>`;
    svg += `<text x="${p.x}" y="${p.y + 48}" text-anchor="middle" font-size="9.5" fill="#7e8a9c">${done ? 'Cleared' : open ? 'Legendary · Lv ' + ar.lv : 'Locked'}</text></g>`;

    svg += `<circle cx="${p.x}" cy="${p.y}" r="15" fill="${done ? gold : '#1d2633'}" stroke="${done || cur ? gold : '#3a4658'}" stroke-width="${cur ? 3 : 2}"/>`;

  });
  $('trailSvg').innerHTML = svg;
  const t = nextT >= 0 ? road[nextT] : nextL >= 0 ? sites[nextL] : slots[10];
  $('trailBar').innerHTML = `<div class="nextcard" style="--c:${gold}"><span class="face">${emblem('crown', gold)}</span><div><b>${nextT >= 0 ? esc(TRAIL_TRAINERS[nextT]) : doneL < 6 ? 'The legendary Mons' : 'Laurel Pass cleared'}</b><small>${nextT >= 0 ? `Beat all ${TRAIL_TRAINERS.length} trainers to reach ${esc(LEAGUE)} · three Mons around level ${trailLv(nextT)} · prize ${money(trainerPrize(trailLv(nextT)))}` : doneL < 6 ? 'The road is clear. The legendary sites beside it are optional; each one unlocks after the last.' : 'Nothing left here. The Elite Four are waiting.'}</small></div></div>
    <div class="row"><button class="btn primary" id="trailWild">Wild battle</button><button class="btn" id="trailHeal">Heal team</button></div>
    <p class="note">Double XP on the ${TRAIL}.</p>`;
  show('trail');
  const wrap = $('trailWrap');
  requestAnimationFrame(() => { const k = wrap.scrollHeight / TRAIL_H; wrap.scrollTop = Math.max(0, t.y * k - wrap.clientHeight / 2); });
}

$('shopTutor').addEventListener('click', async e => {
  const b = e.target.closest('[data-tutor]'); if (!b || b.disabled) return;
  const m = A.team[+b.dataset.tutor];
  if (A.money < TUTOR_PRICE) return;
  const mv = b.dataset.move, name = mset(m).species;
  let msg;
  if (m.moves.length < 4) { m.moves.push(mv); msg = `${name} learned ${mv}!`; }
  else {
    const old = await chooseMove(m, mv, {note: `The lesson costs ${money(TUTOR_PRICE)}, and you only pay if it learns the move.`, cancel: 'Never mind'});
    msg = old ? `${name} forgot ${old} and learned ${mv}!` : `${name} did not learn ${mv}. No charge.`;
    if (!old) { $('shopNote').textContent = msg; renderShop(); return; }
  }
  A.money -= TUTOR_PRICE; m.tutored.push(mv); saveA();

  const p = Object.assign({name: '', playMs: 0}, store.get('profile', null) || {}, patch, {lastPlayed: Date.now()});
  store.set('profile', p);

}
function slotAdv(n) { const a = ls.get(slotKey(n, 'adventure'), null); return a && a.team && a.order ? a : null; }
function slotHall(n) {

}
function hallLine(h) {
  if (!h) return 'Battle Hall: not started';

  return a.e4pos < 4 ? `Next: Elite Four battle ${a.e4pos + 1} of 4` : 'Next: the Champion';
}
function fmtTime(ms) { const m = Math.floor((ms || 0) / 60000); return m < 60 ? `${m}m` : `${Math.floor(m / 60)}h ${m % 60}m`; }
function playedAgo(t) {
  if (!t) return '';

  return d <= 0 ? 'Played today' : d === 1 ? 'Played yesterday' : d < 7 ? `Played ${d} days ago` : d < 14 ? 'Played last week' : `Played ${Math.floor(d / 7)} weeks ago`;
}

// ---------- built teams (shared by every slot) ----------
const builtTeams = () => ls.get('builtTeams', []) || [];
const saveBuiltTeams = list => ls.set('builtTeams', list);
const recentIds = () => ls.get('recentTeams', []) || [];
function noteUsed(mine) {
  if (!mine || mine.kind !== 'built') return;
  ls.set('recentTeams', [mine.id, ...recentIds().filter(id => id !== mine.id)].slice(0, 5));
}
const newTeamId = () => 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function teamProblems(mons) {
  const problems = E.checkTeam(mons.map(E.builtSet));
  for (const m of mons) {
    const mv = (m.moves || []).filter(Boolean);
    if (new Set(mv).size !== mv.length) problems.push(`${m.species} has the same move twice.`);
  }
  return [...new Set(problems)];
}
function importTeamText(text, name) {
  const sets = E.parseSets(text);
  if (!sets.length) return null;
  const mons = sets.slice(0, 6).map(st => ({species: E.Dex.species.get(st.species).name || st.species, ability: st.ability || '', item: st.item || '',
    moves: (st.moves || []).slice(0, 4).map(m => E.Dex.moves.get(m).name || m), nature: st.nature || null,
    evs: st.evs && Object.values(st.evs).some(v => v) ? st.evs : null, spread: null}));
  const t = {id: newTeamId(), name, fav: false, mons, problems: teamProblems(mons), updated: Date.now()};
  saveBuiltTeams([...builtTeams(), t]);
  return t;
}
// Teams saved before save slots ("Paste a team") become built teams, and the old team choice carries over.
function convertLegacyTeams() {
  for (let n = 1; n <= NSLOTS; n++) {
    const old = ls.get(slotKey(n, 'myTeam'), null);
    const ct = ls.get(slotKey(n, 'customTeam'), null);
    let sel = null;
    if (ct && ct.text) { const t = importTeamText(ct.text, 'Pasted team'); if (t && old === 'custom') sel = {kind: 'built', id: t.id}; }
    if (!sel && old && LEADERS[old]) sel = {kind: 'gym', key: old};
    if (sel && !ls.get(slotKey(n, 'hallTeam'), null)) ls.set(slotKey(n, 'hallTeam'), sel);
    ls.del(slotKey(n, 'myTeam')); ls.del(slotKey(n, 'customTeam'));
  }
  hallTeamSel = store.get('hallTeam', null);
}

  for (const st of sets) { let nm = st.species; seen[nm] = (seen[nm] || 0) + 1; if (seen[nm] > 1) nm += ' ' + seen[nm]; st.name = nm; }

function myTeam() {

      label: `${A.playerName || who}'s adventure team`, color: '#e8c76a'};

  if (t.kind === 'built') {

$('slotsBody').addEventListener('click', e => {

// ---------- team builder ----------
let bt = null, btDirty = false, btProblems = null, btLeave = false;
const bf = {q: '', src: 'all', final: true, types: [], limit: 40};

function openBuilder(id) {
  const src = id && builtTeams().find(t => t.id === id);

}

function saveBuilder() {

$('builderBody').addEventListener('click', e => {

// ---------- save backup ----------
const SHARED_SAVE_KEYS = ['builtTeams', 'recentTeams', 'evoSound', 'lastSlot', 'saveVersion'];
const OLD_SAVE_KEYS = ['myTeam', 'customTeam', 'difficulty', 'badgeBook', 'badges', 'champions', 'journey', 'adventure'];
const isSaveKey = k => /^slot[1-4]\./.test(k) || SHARED_SAVE_KEYS.includes(k);
// Save codes: GLB2 is the save data squeezed with deflate (much shorter); GLB1 codes from before still load.
const b64u = bytes => { let s = ''; for (let i = 0; i < bytes.length; i += 8192) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
const unb64u = t => { const s = atob(t.replace(/-/g, '+').replace(/_/g, '/')); const b = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); return b; };
const pipeBytes = async (bytes, stream) => { const w = stream.writable.getWriter(); w.write(bytes); w.close(); return new Uint8Array(await new Response(stream.readable).arrayBuffer()); };
// slot: 1-4 for one slot, or null for everything. Values are stored as real JSON (not text inside text), which also makes the code shorter.
async function saveCode(slot = null) {
  const data = {};
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!isSaveKey(k) || (slot && !k.startsWith(`slot${slot}.`))) continue;
      const raw = localStorage.getItem(k);
      try { data[k] = JSON.parse(raw); } catch (e) { data[k] = {$raw: raw}; }
    }
  } catch (e) { /* storage unavailable */ }
  if (!Object.keys(data).length) return '';
  if (typeof CompressionStream === 'undefined') return 'GLB1:' + btoa(unescape(encodeURIComponent(JSON.stringify(Object.fromEntries(Object.entries(data).map(([k, v]) => [k, v && v.$raw !== undefined ? v.$raw : JSON.stringify(v)]))))));
  return 'GLB2:' + b64u(await pipeBytes(new TextEncoder().encode(JSON.stringify(data)), new CompressionStream('deflate-raw')));
}
async function decodeSave(raw) {
  if (raw.startsWith('GLB1:')) return JSON.parse(decodeURIComponent(escape(atob(raw.slice(5)))));
  if (raw.startsWith('GLB2:')) {
    const obj = JSON.parse(new TextDecoder().decode(await pipeBytes(unb64u(raw.slice(5)), new DecompressionStream('deflate-raw'))));
    return Object.fromEntries(Object.entries(obj).map(([k, v]) => [k, v && typeof v === 'object' && v.$raw !== undefined ? v.$raw : JSON.stringify(v)]));
  }
  return null;
}
async function copySave(slot) {
  const code = await saveCode(slot);
  $('saveBox').hidden = false; $('saveLoadRow').hidden = true;
  if (!code) { $('saveText').value = ''; $('saveNote').textContent = slot ? `Slot ${slot} has no saved data yet.` : 'There is nothing to save yet.'; return; }
  $('saveText').value = code; $('saveText').readOnly = true;
  let copied = false;
  try { await navigator.clipboard.writeText(code); copied = true; } catch (e) { /* clipboard blocked */ }
  if (!copied) { $('saveText').select(); try { copied = document.execCommand('copy'); } catch (e) { copied = false; } }
  const what = slot ? `Slot ${slot} save code` : 'Save code for all slots';
  $('saveNote').textContent = copied ? `${what} copied. Paste it into a message to yourself.` : 'Select all the text above and copy it.';
}
$('saveCopy').addEventListener('click', () => { $('saveSlotRow').hidden = true; copySave(null); });
$('saveCopyOne').addEventListener('click', () => { $('saveSlotRow').hidden = !$('saveSlotRow').hidden; });
$('saveSlotRow').addEventListener('click', e => { const b = e.target.closest('[data-saveslot]'); if (b) copySave(+b.dataset.saveslot); });
$('saveLoadOpen').addEventListener('click', () => {
  $('saveBox').hidden = false; $('saveLoadRow').hidden = false;
  $('saveText').readOnly = false; $('saveText').value = ''; $('saveText').placeholder = 'Paste a save code that starts with GLB2: (or GLB1:)';
  $('saveNote').textContent = 'Loading a code replaces only the save slots that are inside the code. Other slots are not touched.';
  $('saveText').focus();
});
$('saveLoad').addEventListener('click', async () => {
  const raw = $('saveText').value.trim();
  let data = null;
  try { data = await decodeSave(raw); } catch (e) { data = null; }
  if (!data || typeof data !== 'object') { $('saveNote').textContent = "That doesn't look like a save code. Copy the whole thing, starting with GLB2: (or GLB1: for an older code)"; return; }
  try {
    // only the slots (and shared items) that are in the code are replaced; every other slot is left alone
    const inCode = Object.keys(data), slots = new Set(inCode.map(k => (/^slot([1-4])\./.exec(k) || [])[1]).filter(Boolean));
    const drop = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i), m = /^slot([1-4])\./.exec(k);
      if (m ? slots.has(m[1]) : (isSaveKey(k) || OLD_SAVE_KEYS.includes(k)) && inCode.includes(k)) drop.push(k);
    }
    drop.forEach(k => localStorage.removeItem(k));
    for (const [k, v] of Object.entries(data)) if (isSaveKey(k) || OLD_SAVE_KEYS.includes(k)) localStorage.setItem(k, v);
    // a code from before save slots: let the move into Slot 1 run again
    if (!slots.size && !('saveVersion' in data)) localStorage.removeItem('saveVersion');
  } catch (e) { $('saveNote').textContent = "This device won't let the game save. Check that private browsing is off."; return; }
  $('saveNote').textContent = 'Save loaded. Restarting the game…';
  setTimeout(() => location.reload(), 600);
});

  renderOnline();
  if (!db || !myUid) return;
  db.collection('matches').orderBy('createdAt', 'desc').limit(60).onSnapshot(snap => {
    const prev = new Map(matches.map(m => [m.id, m.data.status]));
    matches = snap.docs.filter(d => d.exists).map(d => ({id: d.id, data: d.data()}));
    // When someone joins my open challenge, jump straight into the battle
    const started = matches.find(m => m.data.status === 'active' && m.data.p1 && m.data.p1.uid === myUid && prev.get(m.id) === 'open');
    if (started && !battle) { openMatch(started.id, started.data); return; }
    if ($('setup').hidden === false) renderOnline();
  }, () => { $('online').innerHTML = '<div class="note err">Lost the connection to the lobby. Reload the page to reconnect.</div>'; });
}

function boot() {
  E = window.Engine;
  if (!E) { $('whoisStatus').textContent = 'The battle engine did not load. Reload the page to try again.'; return; }
  convertLegacyTeams();
  migrateRegionalLines(); migrateMoveRev();
  engineReady = true;
  $('whoisFill').style.width = '100%';
  $('whoisStatus').textContent = 'Ready';
  finishIntro();
}
if (window.Engine) boot(); else window.addEventListener('load', boot);
connectOnline();
if ('serviceWorker' in navigator && location.protocol === 'https:' && !window.claude) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
