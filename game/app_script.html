// ---------- storage and save slots ----------
// Each phone has 4 save slots. A slot holds an Adventure half and a Battle Hall half; built teams,
// recently used teams and settings are shared by all slots.
const NSLOTS = 4;
const SLOT_KEYS = new Set(['myTeam', 'customTeam', 'difficulty', 'badgeBook', 'badges', 'champions', 'journey', 'adventure', 'profile', 'hallTeam']);
const ADV_KEYS = ['adventure'];
const HALL_KEYS = ['myTeam', 'customTeam', 'difficulty', 'badgeBook', 'badges', 'champions', 'journey', 'hallTeam'];
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* storage unavailable */ } },
};
const slotKey = (n, k) => `slot${n}.${k}`;
// Saves from before save slots move into Slot 1, once.
if (ls.get('saveVersion', 1) < 2) {
  let had = false;
  for (const k of SLOT_KEYS) {
    try {
      const v = localStorage.getItem(k);
      if (v != null) { had = true; if (localStorage.getItem(slotKey(1, k)) == null) localStorage.setItem(slotKey(1, k), v); localStorage.removeItem(k); }
    } catch (e) { /* storage unavailable */ }
  }
  if (had && !ls.get(slotKey(1, 'profile'), null)) {
    const adv = ls.get(slotKey(1, 'adventure'), null);
    ls.set(slotKey(1, 'profile'), {name: (adv && adv.playerName) || '', hall: true, lastPlayed: Date.now(), playMs: 0});
  }
  ls.set('saveVersion', 2);
  if (had) ls.set('lastSlot', 1);
}
let curSlot = Math.min(NSLOTS, Math.max(1, +ls.get('lastSlot', 1) || 1));
const store = {
  get(k, d) { return ls.get(SLOT_KEYS.has(k) ? slotKey(curSlot, k) : k, d); },
  set(k, v) { ls.set(SLOT_KEYS.has(k) ? slotKey(curSlot, k) : k, v); },
  del(k) { ls.del(SLOT_KEYS.has(k) ? slotKey(curSlot, k) : k); },
};

    wave: `<path d="M24 4C24 4 11 20 11 29a13 13 0 0 0 26 0C37 20 24 4 24 4Z" fill="${c}"/><path d="M15 31c3 3 6 3 9 0s6-3 9 0" stroke="#10131a" stroke-width="2.5" fill="none" opacity=".4" stroke-linecap="round"/>`,

// ---------- state ----------
let E = null;               // engine global
const DIFFS = {
  easy:   {label: 'Easy',   note: 'The computer often picks random moves, never switches out and rarely Mega Evolves.'},
  normal: {label: 'Normal', note: 'The computer picks strong moves and sometimes switches out of bad matchups.'},
  hard:   {label: 'Hard',   note: 'The computer picks its strongest move every turn and always Mega Evolves.'},
};
let difficulty, badgeBook, champions;
function loadHallState() {
  difficulty = store.get('difficulty', 'normal');
  if (!DIFFS[difficulty]) difficulty = 'normal';
  badgeBook = store.get('badgeBook', null) || {easy: {}, normal: store.get('badges', {}) || {}, hard: {}};
  champions = store.get('champions', {});
}
loadHallState();
const badgesFor = d => badgeBook[d] || (badgeBook[d] = {});
let ctx = null;             // null = single gym battle, or {kind: 'gauntlet' | 'journey', ...}
const fxType = {p1: 'Normal', p2: 'Normal'};
let battle = null, mem = {}, logIdx = 0, view = null, playing = false, skip = false, panel = 'fight';
let mode = 'cpu';           // 'cpu' or 'online'
let ME = 'p1', FOE = 'p2';
let foe = {name: '', key: null, color: CUSTOM_COLOR};  // who you're facing
let resultShown = false;

// online state
let db = null, user = null, myUid = null, canWrite = null;
let matches = [];           // lobby snapshot
let match = null;           // {id, data}
let choices = {p1: [], p2: []}, applied = {p1: 0, p2: 0};

// ---------- setup screen ----------
function renderBadges() {
  const badges = badgesFor(difficulty);
  const got = ORDER.filter(k => badges[k]).length;
  $('badgeCount').innerHTML = `${esc(DIFFS[difficulty].label)} · ${got} of ${ORDER.length}${champions[difficulty] ? '<span class="champchip">Champion</span>' : ''}`;
  $('badges').innerHTML = ORDER.map(k => {
    const L = LEADERS[k];
    return `<div class="badge ${badges[k] ? 'earned' : ''}" style="--c:${L.color}" title="${esc(L.badge)}${badges[k] ? ' earned' : ''}">${emblem(L.icon, L.color)}<span>${esc(L.badge.replace('badge', ''))}</span></div>`;
  }).join('');
}

// The Battle Hall's "Your team" panel (built in the hall section further down).
function renderTeamChips() { if (typeof renderTeamPanel === 'function') renderTeamPanel(); }

function teamNames(text) {
  return (text || '').split(/\n\s*\n/).map(b => b.trim().split('\n')[0].split(' @ ')[0].replace(/\s*\((M|F)\)\s*$/, '').replace(/^.*\((.+)\)$/, '$1').trim()).filter(Boolean).join(' · ');
}

function renderLeaders() {
  const badges = badgesFor(difficulty);
  renderGauntletCard();
  $('leaders').innerHTML = ORDER.map(k => {
    const L = LEADERS[k];
    const mons = E ? teamNames(E.TEAM_TEXT[k]) : '';
    return `<button class="leader" id="leader-${k}" data-k="${k}" style="--c:${L.color}" ${E ? '' : 'disabled'}>
      ${emblem(L.icon, L.color)}
      <div class="who"><div class="meta">${esc(L.type)} · ${esc(L.badge)}</div><div class="title">${esc(L.title)}</div><div class="mons">${esc(mons)}</div></div>
      <div class="go">${badges[k] ? 'REMATCH' : 'BATTLE'}</div></button>`;
  }).join('');
}

$('leaders').addEventListener('click', e => {
  const b = e.target.closest('.leader'); if (!b || !E) return;
  startCpuBattle(b.dataset.k);
});

function myTeamText() { const m = myTeam(); return m ? (m.text || E.setsToText(m.sets)) : null; }
function baseName() { const m = myTeam(); return m ? m.name : 'Player'; }
function needTeam() { openHall(); toast('Pick a team for the Battle Hall first.'); }

const SCREENS = ['title', 'slots', 'options', 'setup', 'teams', 'builder', 'moned', 'lead', 'battle', 'info', 'jstart', 'journey', 'jbag', 'shop', 'quest', 'intro', 'dex'];
let curScreen = null;
function show(id) { curScreen = id; $('toast').hidden = true; for (const s of SCREENS) $(s).hidden = s !== id; window.scrollTo(0, 0); }
function setAccent(color) { document.documentElement.style.setProperty('--accent', color); }

// ---------- shared battle start ----------
function beginBattle(p1, p2, seed) {
  battle = E.createBattle(p1, p2, seed);
  logIdx = battle.log.length;
  view = {p1: blankMon(), p2: blankMon()};
  panel = 'fight'; resultShown = false;
  $('log').innerHTML = '';
  $('overlay').hidden = true;
  $('vsLabel').innerHTML = `<small>${esc(mode === 'online' ? 'Online battle' : (foe.subtitle || ''))}</small>You vs ${esc(foe.name)}`;
  for (const id of ['myCard', 'foeCard']) $(id).classList.remove('fx-hit', 'fx-shake', 'fx-act', 'fx-faint');
  bagSel = null;
}

function showLeadScreen() {
  $('leadTitle').textContent = `vs ${foe.title || foe.name}`;
  $('leadSub').textContent = mode === 'cpu'
    ? `${foe.subtitle || ''}. Pick who goes out first.`
    : `Online battle. Pick who goes out first. ${foe.name} is choosing too.`;
  $('foeRoster').innerHTML = battle[FOE].pokemon.map(p => `${esc(p.species.name)} ${typesHTML(p.species.types)}`).join('<br>');
  const carry = ctx && ctx.kind !== undefined;
  $('leadList').innerHTML = battle[ME].pokemon.map((p, i) => {
    const pct = p.maxhp ? p.hp / p.maxhp * 100 : 0;
    const hpBar = carry ? `<span class="hpmini"><i style="width:${pct}%;background:${hpColor(pct)}"></i></span><small>${p.fainted ? 'Fainted' : `${p.hp}/${p.maxhp} HP`}</small>` : '';
    return `<button class="pick" id="lead-${i}" data-i="${i + 1}" ${p.fainted ? 'disabled' : ''}><div><b>${esc(p.species.name)}</b><small>${esc(p.item ? E.Dex.items.get(p.item).name : '')} · ${p.moveSlots.map(m => esc(m.move)).join(', ')}</small>${hpBar}</div>${typesHTML(p.species.types)}</button>`;
  }).join('');
  $('leadBack').textContent = mode !== 'cpu' ? 'Back to lobby' : ctx && ctx.kind === 'journey' ? 'Back to map' : 'Back';
  show('lead');
}

$('leadBack').addEventListener('click', () => leaveBattle());
$('leadList').addEventListener('click', e => {
  const b = e.target.closest('.pick'); if (!b) return;
  const lead = +b.dataset.i;
  if (battle[ME].pokemon[lead - 1].fainted) return;
  const order = [lead, ...battle[ME].pokemon.map((_, i) => i + 1).filter(i => i !== lead)];
  show('battle');
  commit('team ' + order.join(''));
});

function blankMon() { return {ident: '', species: '', hp: 0, maxhp: 100, status: '', boosts: {}}; }
function typesHTML(types) { return `<span class="types">${types.map(t => `<span class="type" style="--t:${TYPE_COLORS[t] || '#999'}">${esc(t)}</span>`).join('')}</span>`; }

// ---------- computer battles ----------
function startCpuBattle(k) {
  const mine = myTeam();
  if (!mine) { needTeam(); return; }
  ctx = null;
  noteUsed(mine);
  const L = LEADERS[k];
  foe = {name: L.first, key: k, color: L.color, icon: L.icon, title: L.title, subtitle: `${L.badge} · ${DIFFS[difficulty].label}${mine.levels ? ' · levels matched to your team' : ''}`};
  startVsCpu(foeTeamFor(E.TEAM_TEXT[k], mine.levels), null, mine.sets || mine.text, mine.name);
}

function startVsCpu(foeTeamText, state, playerText, playerName) {
  mode = 'cpu'; ME = 'p1'; FOE = 'p2'; mem = {};
  setAccent(foe.color);
  let p1name = playerName || 'You';
  if (p1name === foe.name) p1name = 'You';
  const asTeam = t => Array.isArray(t) ? t : E.parseTeam(t).team;
  beginBattle({name: p1name, team: asTeam(playerText)}, {name: foe.name, team: asTeam(foeTeamText)});
  if (state) E.applyTeamState(battle.p1, state);
  if (ctx && ctx.kind === 'adventure') applyAdvHP();
  $('battleMap').hidden = !(ctx && (ctx.kind === 'journey' || ctx.kind === 'adventure'));
  showLeadScreen();
}

function aiLevel() { return ctx && ctx.kind === 'journey' && J ? J.difficulty : ctx && ctx.kind === 'adventure' && A ? A.difficulty : difficulty; }
function usesBag() { return !!(ctx && (ctx.kind === 'journey' || ctx.kind === 'adventure')); }
function bagNow() { return ctx && ctx.kind === 'adventure' ? A.bag : J.bag; }
function saveBagOwner() { if (ctx && ctx.kind === 'adventure') saveA(); else saveJ(); }

function runAI() {
  const s = battle.p2, r = s.activeRequest;
  if (!r || r.wait || s.isChoiceDone()) return;
  const c = E.aiChoose(battle, 'p2', mem, aiLevel()) || 'default';
  if (!battle.choose('p2', c)) battle.choose('p2', 'default');
}

// ---------- choices ----------
async function commit(choice) {
  if (playing || !battle || battle.ended) return;
  if (mode === 'cpu') {
    runAI();
    if (!battle.choose('p1', choice)) { chooseError(); return; }
    E.recountLeft(battle.p1);
    // the computer may still owe choices (e.g. replacing a fainted Pokémon)
    await refresh();
    return;
  }
  // online: validate on a scratch check, then record it
  const req = battle[ME].activeRequest;
  if (!req || req.wait || battle[ME].isChoiceDone()) return;
  const ok = battle.choose(ME, choice);
  if (!ok) { chooseError(); return; }
  choices[ME] = [...choices[ME], choice];
  applied[ME] = choices[ME].length;
  renderControls();
  try {
    await db.doc(`matches/${match.id}/moves/${ME}`).set({list: choices[ME], at: Date.now()});
  } catch (e) {
    addLine(e && e.code === 'invalid_argument' ? "Your move couldn't be saved. You need edit access to this page to battle online." : "Your move couldn't be saved. Check your connection and reload the page to continue.", 'bad');
  }
  await refresh();
}

function chooseError() {
  const err = battle[ME].choice && battle[ME].choice.error;
  addLine(err ? esc(err.replace(/^\[.*?\]\s*/, '')) : 'That choice is not allowed right now.', 'bad');
}

// Apply any recorded choices that the local battle hasn't used yet (online)
function applyQueued() {
  let progressed = true;
  while (progressed && !battle.ended) {
    progressed = false;
    for (const s of ['p1', 'p2']) {
      const r = battle[s].activeRequest;
      if (!r || r.wait || battle[s].isChoiceDone()) continue;
      const c = choices[s][applied[s]];
      if (c === undefined) continue;
      applied[s]++;
      if (!battle.choose(s, c)) battle.choose(s, 'default');
      progressed = true;
    }
  }
  if (match && match.data.forfeit && !battle.ended) battle.forceWin(match.data.forfeit === 'p1' ? 'p2' : 'p1');
}

async function refresh() {
  if (!battle) return;
  if (refreshing) { refreshAgain = true; return; }
  refreshing = true;
  try {
    do {
      refreshAgain = false;
      if (mode === 'online') applyQueued();
      else {
        for (let g = 0; g < 10 && !battle.ended; g++) {
          const r1 = battle.p1.activeRequest;
          if (r1 && !r1.wait && !battle.p1.isChoiceDone()) break;
          const before = battle.log.length; runAI();
          if (battle.log.length === before) break;
        }
      }
      await play();
    } while (refreshAgain && battle);
  } finally { refreshing = false; }
  if (!battle) return;
  syncFromState();
  const req = battle[ME].activeRequest;
  if (!battle.ended && req && req.teamPreview && !battle[ME].isChoiceDone()) { showLeadScreen(); return; }
  if (!$('battle').hidden || !$('lead').hidden) show('battle');
  renderControls();
  if (battle.ended && !resultShown) {
    resultShown = true;
    if (mode === 'online' && match && match.data.status !== 'done') {
      db.doc('matches/' + match.id).update({status: 'done', winner: battle.winner || ''}).catch(() => {});
    }
    setTimeout(showResult, skip ? 0 : 500);
  }
}

// ---------- log playback ----------
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function play() {
  const lines = battle.log.slice(logIdx);
  logIdx = battle.log.length;
  const events = translate(lines);
  playing = true;
  if (!events.length) { playing = false; return; }
  for (const ev of events) {
    if (ev.apply) ev.apply();
    if (ev.text) addLine(ev.text, ev.cls);
    renderCards();
    if (ev.fx) applyFx(ev.fx);
    if (ev.text && !skip) await sleep(ev.cls === 'turn' ? 150 : 520);
  }
  playing = false;
  skip = false;
}
$('log').addEventListener('click', () => { skip = true; });

function addLine(text, cls) {
  const p = document.createElement('p');
  if (cls) p.className = cls;
  p.innerHTML = text;
  const log = $('log');
  log.appendChild(p);
  while (log.childNodes.length > 250) log.removeChild(log.firstChild);
  log.scrollTop = log.scrollHeight;
}

function parseHP(str, side) {
  if (!str) return null;
  const [frac, st] = str.split(' ');
  if (frac === '0') return {hp: 0, maxhp: view[side].maxhp || 100, status: 'fnt'};
  const [a, b] = frac.split('/').map(Number);
  return {hp: a, maxhp: b || 100, status: st || ''};
}
function pctOf(side) { const v = view[side]; return v.maxhp ? v.hp / v.maxhp * 100 : 0; }

function translate(lines) {
  const out = [];
  const foeName = foe.name;
  const sideOf = id => (id || '').slice(0, 2);
  const nick = id => (id || '').split(': ').slice(1).join(': ');
  const Nm = id => sideOf(id) === ME ? `<span class="key">${esc(nick(id))}</span>` : foe.wild ? `Wild <span class="key">${esc(nick(id))}</span>` : `${esc(foeName)}'s <span class="key">${esc(nick(id))}</span>`;
  const nm = Nm;
  const fromTag = parts => { const f = parts.find(x => x && x.startsWith('[from]')); return f ? f.slice(7).replace(/^(item|ability|move): /, '').trim() : ''; };
  const teamOf = s => s.startsWith(ME) ? 'your team' : `${esc(foeName)}'s team`;

  for (let i = 0; i < lines.length; i++) {
    let line = lines[i];
    if (line.startsWith('|split|')) {
      const s = line.slice(7);
      line = s === ME ? lines[i + 1] : lines[i + 2];
      i += 2;
    }
    if (!line || line[0] !== '|') continue;
    const parts = line.slice(1).split('|');
    const cmd = parts[0];
    const id = parts[1];
    const s = sideOf(id);
    switch (cmd) {
      case 'switch': case 'drag': {
        const species = parts[2].split(',')[0];
        const hp = parseHP(parts[3], s);
        out.push({fx: {side: s, kind: 'clear'}, apply() { if (ctx && ctx.kind === 'adventure') markSeen(species); view[s] = {ident: id, species, hp: hp.hp, maxhp: hp.maxhp, status: hp.status === 'fnt' ? '' : hp.status, boosts: {}}; },
          text: cmd === 'drag' ? `${Nm(id)} was dragged out!` : s === ME ? `Go! <span class="key">${esc(nick(id))}</span>!` : foe.wild ? `A wild <span class="key">${esc(nick(id))}</span> appeared!` : `${esc(foeName)} sent out <span class="key">${esc(nick(id))}</span>!`});
        break;
      }
      case 'replace': {
        const species = parts[2].split(',')[0];
        out.push({apply() { view[s].species = species; view[s].ident = id; }, text: `The Illusion broke! It was ${s === ME ? '' : esc(foeName) + "'s "}<span class="key">${esc(species)}</span>!`});
        break;
      }
      case 'detailschange': {
        const species = parts[2].split(',')[0];
        out.push({apply() { view[s].species = species; }});
        break;
      }
      case 'move': {
        const extra = parts.slice(4).join(' ');
        if (extra.includes('[still]') && extra.includes('[from]')) break;
        fxType[s] = E.Dex.moves.get(parts[2]).type || 'Normal';
        out.push({text: `${Nm(id)} used <b>${esc(parts[2])}</b>!`, fx: {side: s, kind: 'act'}});
        break;
      }
      case '-damage': {
        const hp = parseHP(parts[2], s);
        const from = fromTag(parts);
        out.push({fx: from ? null : {side: s, kind: 'hit', color: TYPE_COLORS[fxType[s === 'p1' ? 'p2' : 'p1']] || '#ffffff'}, apply() {
            const before = pctOf(s);
            view[s].hp = hp.hp; view[s].maxhp = hp.maxhp;
            if (hp.status && hp.status !== 'fnt') view[s].status = hp.status;
            const drop = before - pctOf(s);
            this.lost = drop > 0 ? Math.max(1, Math.round(drop)) : 0;
          },
          get text() { return this.lost === undefined || this.lost === 0 ? '' : `${Nm(id)} lost ${this.lost}% of its health${from ? ` <span class="info">(${esc(from === 'psn' || from === 'tox' ? 'poison' : from === 'brn' ? 'burn' : from)})</span>` : ''}.`; },
          cls: s === ME ? 'bad' : ''});
        break;
      }
      case '-heal': {
        const hp = parseHP(parts[2], s);
        const from = fromTag(parts);
        out.push({apply() { const before = pctOf(s); view[s].hp = hp.hp; view[s].maxhp = hp.maxhp; const up = pctOf(s) - before; this.gain = up > 0 ? Math.max(1, Math.round(up)) : 0; },
          get text() { return this.gain === undefined ? '' : (this.gain ? `${Nm(id)} restored ${this.gain}% HP${from ? ` <span class="info">(${esc(from)})</span>` : ''}.` : ''); },
          cls: s === ME ? 'good' : ''});
        break;
      }
      case 'faint':
        out.push({fx: {side: s, kind: 'faint'}, apply() { view[s].hp = 0; view[s].status = ''; }, text: `${Nm(id)} fainted!`, cls: s === ME ? 'bad' : 'good'});
        break;
      case '-supereffective': out.push({text: `It's super effective!`, fx: {side: s, kind: 'shake'}}); break;
      case '-resisted': out.push({text: `It's not very effective…`, cls: 'info'}); break;
      case '-immune': out.push({text: `It doesn't affect ${nm(id)}…`, cls: 'info'}); break;
      case '-crit': out.push({text: `A critical hit!`, fx: {side: s, kind: 'shake'}}); break;
      case '-miss': out.push({text: parts[2] ? `${Nm(parts[2])} avoided the attack!` : `The attack missed!`, cls: 'info'}); break;
      case '-fail': out.push({text: `But it failed!`, cls: 'info'}); break;
      case '-hitcount': out.push({text: `Hit ${esc(parts[2])} time${parts[2] === '1' ? '' : 's'}!`, cls: 'info'}); break;
      case '-status': {
        const st = parts[2];
        const msg = {psn: 'was poisoned', tox: 'was badly poisoned', brn: 'was burned', par: 'is paralyzed! It may be unable to move', slp: 'fell asleep', frz: 'was frozen solid'}[st] || 'got a status condition';
        out.push({apply() { view[s].status = st; }, text: `${Nm(id)} ${msg}!`});
        break;
      }
      case '-curestatus': {
        const st = parts[2];
        const msg = st === 'slp' ? 'woke up' : st === 'frz' ? 'thawed out' : 'was cured';
        out.push({apply() { if (view[s].ident === id) view[s].status = ''; }, text: `${Nm(id)} ${msg}!`});
        break;
      }
      case 'cant': {
        const why = parts[2];
        const msg = why === 'slp' ? 'is fast asleep.' : why === 'par' ? "is paralyzed! It can't move!" : why === 'frz' ? 'is frozen solid!' : why === 'recharge' ? 'must recharge!' : why === 'flinch' ? 'flinched!' : "can't move!";
        out.push({text: `${Nm(id)} ${msg}`, cls: 'info'});
        break;
      }
      case '-boost': case '-unboost': {
        const stat = parts[2], n = +parts[3], up = cmd === '-boost';
        const adv = n >= 3 ? (up ? 'rose drastically' : 'fell severely') : n === 2 ? (up ? 'rose sharply' : 'harshly fell') : n === 1 ? (up ? 'rose' : 'fell') : (up ? "won't go any higher" : "won't go any lower");
        out.push({apply() { view[s].boosts[stat] = Math.max(-6, Math.min(6, (view[s].boosts[stat] || 0) + (up ? n : -n))); }, text: `${Nm(id)}'s ${STAT_NAMES[stat] || stat} ${adv}!`});
        break;
      }
      case '-weather': {
        const w = parts[1];
        if (line.includes('[upkeep]')) break;
        const msg = {Snowscape: 'It started to snow!', Snow: 'It started to snow!', Hail: 'It started to hail!', SandStorm: 'A sandstorm kicked up!', Sandstorm: 'A sandstorm kicked up!', RainDance: 'It started to rain!', SunnyDay: 'The sunlight turned harsh!', none: 'The weather cleared up.'}[w] || '';
        if (msg) out.push({text: msg, cls: 'info'});
        break;
      }
      case '-sidestart': {
        const cond = parts[2].replace('move: ', '');
        const team = teamOf(parts[1]);
        const msg = {
          'Stealth Rock': `Pointed stones float around ${team}!`, 'Spikes': `Spikes were scattered around ${team}'s feet!`,
          'Toxic Spikes': `Poison spikes were scattered around ${team}'s feet!`, 'Sticky Web': `A sticky web spreads out under ${team}!`,
          'Aurora Veil': `Aurora Veil made ${team} stronger against attacks!`, 'Reflect': `Reflect raised ${team}'s Defense!`, 'Light Screen': `Light Screen raised ${team}'s Sp. Def!`,
        }[cond] || `${esc(cond)} started on ${team}'s side.`;
        out.push({text: msg, cls: 'info'});
        break;
      }
      case '-sideend': {
        const cond = parts[2].replace('move: ', '');
        out.push({text: `${esc(cond)} is gone from ${teamOf(parts[1])}'s side.`, cls: 'info'});
        break;
      }
      case '-mega': out.push({text: `${Nm(id)} Mega Evolved into <b>Mega ${esc(parts[2])}</b>!`, cls: 'good'}); break;
      case '-enditem': {
        const item = parts[2];
        const tail = parts.slice(3).join(' ');
        let msg;
        if (tail.includes('Knock Off')) msg = `${Nm(id)} lost its ${esc(item)}!`;
        else if (tail.includes('[eat]')) msg = `${Nm(id)} ate its ${esc(item)}!`;
        else msg = `${Nm(id)} used up its ${esc(item)}.`;
        out.push({text: msg, cls: 'info'});
        break;
      }
      case '-ability': out.push({text: `<span class="info">[${nm(id)}'s ${esc(parts[2])}]</span>`}); break;
      case '-activate': {
        const eff = parts[2] || '';
        if (eff === 'ability: Sturdy') out.push({text: `${Nm(id)} endured the hit with Sturdy!`});
        else if (eff.startsWith('move: Infestation')) out.push({text: `${Nm(id)} is trapped by an infestation!`, cls: 'info'});
        else if (eff === 'confusion') out.push({text: `${Nm(id)} is confused!`, cls: 'info'});
        break;
      }
      case '-start': {
        const eff = (parts[2] || '').replace('move: ', '');
        if (eff === 'Encore') out.push({text: `${Nm(id)} must do an encore!`});
        else if (eff === 'confusion') out.push({text: `${Nm(id)} became confused!`});
        else if (eff === 'Substitute') out.push({text: `${Nm(id)} put in a substitute!`});
        break;
      }
      case '-end': {
        const eff = (parts[2] || '').replace('move: ', '');
        if (eff === 'Encore') out.push({text: `${Nm(id)}'s encore ended.`, cls: 'info'});
        break;
      }
      case '-message': out.push({text: esc(parts[1]), cls: 'info'}); break;
      case 'turn': out.push({text: `Turn ${esc(parts[1])}`, cls: 'turn'}); break;
      case 'win': if (ctx && ctx.fight && (ctx.fight.caught || ctx.fight.finished)) break; out.push({text: parts[1] === battle[ME].name ? 'You won the battle!' : `${esc(foeName)} won the battle!`, cls: parts[1] === battle[ME].name ? 'good' : 'bad'}); break;
      case 'tie': out.push({text: `The battle ended in a tie.`}); break;
      case 'error': out.push({text: esc(parts.slice(1).join(' ')), cls: 'bad'}); break;
    }
  }
  return out;
}

// ---------- rendering ----------
function hpColor(pct) { return pct > 50 ? 'var(--hp-good)' : pct > 20 ? 'var(--hp-mid)' : 'var(--hp-low)'; }

function cardHTML(side) {
  const v = view[side];
  if (!v.species) return `<div class="head"><span class="name">${side === ME ? 'Your side' : esc(foe.name)}</span><span class="owner">${side === ME ? 'You' : 'Opponent'}</span></div><div class="note">Waiting for the first Pokémon…</div>`;
  const sp = E.Dex.species.get(v.species);
  const pct = Math.max(0, pctOf(side));
  const shownPct = v.hp > 0 ? Math.max(1, Math.round(pct)) : 0;
  const hpText = side === ME ? `${Math.max(0, v.hp)}/${v.maxhp}` : `${shownPct}%`;
  const st = STATUS[v.status];
  const boosts = Object.entries(v.boosts).filter(([, n]) => n).map(([k, n]) => `<span class="boost ${n > 0 ? 'up' : 'down'}">${STAT_SHORT[k] || k} ${n > 0 ? '+' : ''}${n}</span>`).join('');
  const sideObj = battle[side];
  const hazards = Object.keys(sideObj.sideConditions).filter(k => k !== 'catchguard').map(k => {
    const c = sideObj.sideConditions[k];
    const name = E.Dex.conditions.get(k).name || k;
    return `<span class="hazard">${esc(name)}${c.layers > 1 ? ' ×' + c.layers : ''}</span>`;
  }).join('');
  const balls = sideObj.pokemon.map(p => `<i class="${p.fainted || p.hp <= 0 ? 'out' : p.hp < p.maxhp / 2 ? 'hurt' : ''} ${p.isActive ? 'active' : ''}"></i>`).join('');
  const art = artOf(sp.name);
  return `${art ? `<span class="cardart">${art}</span>` : ''}
    <div class="head"><span class="name">${sp.isMega ? 'Mega ' : ''}${esc(sp.isMega ? sp.baseSpecies : sp.name)}${battle[side].active[0] && battle[side].active[0].level !== 100 ? ` <small class="lvl">Lv ${battle[side].active[0].level}</small>` : ''}</span><span class="owner">${side === ME ? 'You' : esc(foe.name)}</span></div>
    <div class="row" style="justify-content:space-between">${typesHTML(sp.types)}<span class="balls" aria-label="Team status">${balls}</span></div>
    <div class="hpwrap"><div class="hp"><i style="width:${pct}%;background-color:${hpColor(pct)}"></i></div><span class="hptext">${hpText}</span></div>
    <div class="tags">${st ? `<span class="status" style="background:${st[1]}">${st[0]}</span>` : ''}${boosts}${hazards}</div>`;
}

function renderCards() {
  $('foeCard').innerHTML = cardHTML(FOE);
  $('myCard').innerHTML = cardHTML(ME);
  $('foeCard').classList.toggle('hasart', !!(view[FOE].species && artOf(view[FOE].species)));
  $('myCard').classList.toggle('hasart', !!(view[ME].species && artOf(view[ME].species)));
  const w = battle.field.weather;
  const wname = w ? (E.Dex.conditions.get(w).name || w) : '';
  $('weather').textContent = wname ? `${wname === 'Snowscape' ? 'Snow' : wname} · ${battle.field.weatherState.duration || ''} turns left` : '';
}

function applyFx(fx) {
  const el = $(fx.side === ME ? 'myCard' : 'foeCard');
  if (!el) return;
  const pulse = cls => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); setTimeout(() => el.classList.remove(cls), 520); };
  if (fx.kind === 'hit') { el.style.setProperty('--fx', fx.color); pulse('fx-hit'); }
  else if (fx.kind === 'shake') pulse('fx-shake');
  else if (fx.kind === 'act') pulse('fx-act');
  else if (fx.kind === 'faint') el.classList.add('fx-faint');
  else if (fx.kind === 'clear') el.classList.remove('fx-faint');
}

// After playback, correct the view from the true battle state
function syncFromState() {
  for (const side of ['p1', 'p2']) {
    const real = battle[side].active[0];
    if (!real) continue;
    const p = real;
    const v = view[side];
    v.species = side === FOE && real.illusion ? real.illusion.species.name : real.species.name;
    v.ident = side + 'a: ' + p.name;
    if (side === ME) { v.hp = p.hp; v.maxhp = p.maxhp; } else { v.hp = p.hp ? Math.max(1, Math.round(p.hp / p.maxhp * 100)) : 0; v.maxhp = 100; }
    v.status = p.status || '';
    v.boosts = {...p.boosts};
  }
  renderCards();
}

function renderControls() {
  const c = $('controls');
  if (!battle || battle.ended) { c.innerHTML = ''; return; }
  const req = battle[ME].activeRequest;
  if (!req || req.wait || battle[ME].isChoiceDone()) {
    c.innerHTML = `<div class="waiting">${mode === 'online' ? '<span class="pulse"></span>' : ''}Waiting for ${esc(foe.name)}…</div>`;
    return;
  }
  if (req.teamPreview) { c.innerHTML = ''; return; }
  if (!req.forceSwitch && catchPending()) { c.innerHTML = catchHTML(); return; }
  const forced = !!req.forceSwitch;
  if (forced) panel = 'switch';
  const act = req.active && req.active[0];
  const trapped = act && (act.trapped || act.maybeTrapped);
  let html = '';
  if (!forced) {
    html += `<div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-fight" aria-selected="${panel === 'fight'}" data-panel="fight">Fight</button>
      <button class="tab" role="tab" id="tab-switch" aria-selected="${panel === 'switch'}" data-panel="switch">Pokémon</button>
      ${usesBag() ? `<button class="tab" role="tab" id="tab-bag" aria-selected="${panel === 'bag'}" data-panel="bag">Bag</button>` : ''}
      ${act && act.canMegaEvo ? '<label class="mega"><input type="checkbox" id="megaBox"> Mega Evolve</label>' : ''}
    </div>`;
  } else {
    html += `<div class="prompt">Choose your next Pokémon.</div>`;
  }
  if (panel === 'bag' && !forced && usesBag()) {
    html += bagButtons(bagNow(), bagSel, true);
    if (!bagSel) html += '<div class="prompt">Pick an item. Using one takes your turn.</div>';
    if (bagSel) {
      html += `<div class="prompt">${esc(E.ITEMS[bagSel].desc)} Use it on which Pokémon?</div><div class="swaps">` + battle.p1.pokemon.map((p, i) => {
        const prob = E.itemProblem(bagSel, p);
        const pct = p.maxhp ? p.hp / p.maxhp * 100 : 0;
        return `<button class="swap" id="use-${i}" data-use="${i}" ${prob ? 'disabled' : ''} title="${esc(prob)}"><b>${esc(p.name)}${p.isActive ? ' · in battle' : ''}</b>
          <div class="hp"><i style="width:${p.fainted ? 0 : pct}%;background-color:${hpColor(pct)}"></i></div>
          <small class="note">${p.fainted ? 'Fainted' : `${p.hp}/${p.maxhp} HP`}${p.status && p.status !== 'fnt' ? ' · ' + p.status.toUpperCase() : ''}</small></button>`;
      }).join('') + '</div>';
    }
  } else if (panel === 'fight' && act) {
    const me = battle[ME].active[0], foeReal = battle[FOE].active[0];
    // Don't let move hints reveal an Illusion: judge matchups against what you can see
    const foeMon = foeReal && foeReal.illusion ? Object.assign(Object.create(foeReal), {types: foeReal.illusion.types, species: foeReal.illusion.species, ability: '', weighthg: foeReal.illusion.weighthg}) : foeReal;
    html += '<div class="moves">' + act.moves.map((m, i) => {
      const mv = E.Dex.moves.get(m.id);
      let effTxt = '';
      if (mv.category !== 'Status' && foeMon && !foeMon.fainted) {
        const r = E.estimate(battle, me, foeMon, m.id);
        if (r) effTxt = r.eff === 0 ? '<span class="eff no">No effect</span>' : r.eff > 1 ? '<span class="eff se">Super effective</span>' : r.eff < 1 ? '<span class="eff nve">Resisted</span>' : '';
      }
      const pow = mv.category === 'Status' ? 'Status' : (mv.basePower ? `${mv.basePower} power` : mv.category);
      const pp = m.maxpp ? `${m.pp}/${m.maxpp} PP` : '';
      return `<button class="move" id="move-${i + 1}" data-slot="${i + 1}" style="--t:${TYPE_COLORS[mv.type] || '#999'}" ${m.disabled ? 'disabled' : ''} title="${esc(mv.shortDesc || '')}">
        <b>${esc(m.move)}</b><small><span>${esc(mv.type)} · ${esc(pow)}</span></small><small>${effTxt || '<span></span>'}<span>${pp}</span></small></button>`;
    }).join('') + '</div>';
  } else {
    html += '<div class="swaps">' + req.side.pokemon.map((p, i) => {
      const [hpStr, st] = p.condition.split(' ');
      const [a, b] = hpStr.split('/').map(Number);
      const pct = b ? a / b * 100 : 0;
      const fainted = st === 'fnt' || hpStr === '0';
      const disabled = p.active || fainted || (!forced && trapped);
      const name = p.details.split(',')[0];
      return `<button class="swap" id="swap-${i + 1}" data-i="${i + 1}" ${disabled ? 'disabled' : ''}>
        <b>${esc(name)}${p.active ? ' · in battle' : ''}</b>
        <div class="hp"><i style="width:${fainted ? 0 : pct}%;background-color:${hpColor(pct)}"></i></div>
        <small class="note">${fainted ? 'Fainted' : `${Math.max(0, a)}/${b} HP`}${st && st !== 'fnt' ? ' · ' + st.toUpperCase() : ''}</small></button>`;
    }).join('') + '</div>';
    if (!forced && trapped) html += '<div class="prompt">You are trapped and cannot switch out.</div>';
  }
  c.innerHTML = html;
}

$('controls').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t || t.disabled || playing) return;
  if (t.id === 'catchThrow') { throwBall(); return; }
  if (t.id === 'catchNo') { finishWild(); return; }
  if (t.dataset.panel) { panel = t.dataset.panel; bagSel = null; renderControls(); return; }
  if (t.dataset.item) { bagSel = bagSel === t.dataset.item ? null : t.dataset.item; renderControls(); return; }
  if (t.dataset.use) { useItemInBattle(+t.dataset.use); return; }
  if (t.dataset.slot) {
    const mega = $('megaBox') && $('megaBox').checked;
    commit(`move ${t.dataset.slot}${mega ? ' mega' : ''}`);
    return;
  }
  if (t.dataset.i) { panel = 'fight'; commit(`switch ${t.dataset.i}`); }
});

// ---------- forfeit and results ----------
let forfeitArmed = false;
$('forfeit').addEventListener('click', async () => {
  if (!battle) return;
  if (battle.ended) { leaveBattle(); return; }
  if (!forfeitArmed) { forfeitArmed = true; $('forfeit').textContent = 'Tap again to forfeit'; setTimeout(() => { forfeitArmed = false; $('forfeit').textContent = 'Forfeit'; }, 2500); return; }
  forfeitArmed = false; $('forfeit').textContent = 'Forfeit';
  if (mode === 'online') {
    try { await db.doc('matches/' + match.id).update({forfeit: ME, status: 'done'}); }
    catch (e) { addLine("Couldn't reach the server to forfeit. Try again.", 'bad'); return; }
    match.data = {...match.data, forfeit: ME, status: 'done'};
  }
  battle.forceWin(FOE);
  await refresh();
});

function showResult() {
  if (!battle) return;
  const won = battle.winner === battle[ME].name;
  if (ctx && ctx.kind === 'journey') { journeyBattleOver(won); return; }
  if (ctx && ctx.kind === 'adventure') { advBattleOver(won); return; }
  if (ctx && ctx.kind === 'gauntlet') { gauntletResult(won); return; }
  const badges = badgesFor(difficulty);
  const forfeited = mode === 'online' ? match && match.data.forfeit : !won && !battle[FOE].pokemon.every(p => p.fainted) && !battle[ME].pokemon.every(p => p.fainted);
  let html;
  if (mode === 'cpu') {
    const L = LEADERS[foe.key];
    if (won) {
      const first = !badges[foe.key];
      badges[foe.key] = true; store.set('badgeBook', badgeBook);
      const left = battle[ME].pokemon.filter(p => !p.fainted).length;
      html = `${emblem(L.icon, L.color)}<h3>${esc(L.badge)}${first ? ' earned' : ' defended'}</h3>
        <p>You beat ${esc(L.title)} with ${left} Pokémon still standing, in ${battle.turn} turns.</p>`;
    } else {
      html = `${emblem(L.icon, L.color)}<h3>${esc(L.first)} wins</h3><p>${forfeited ? 'You forfeited the match.' : `${esc(L.title)} held the ${esc(L.badge)} after ${battle.turn} turns.`} Try a different lead or switch more often.</p>`;
    }
    html += `<div class="row" style="justify-content:center"><button class="btn primary" id="rematch">Rematch</button><button class="btn" id="toSetup">Choose another gym</button></div>`;
  } else {
    const ic = foe.key ? LEADERS[foe.key].icon : 'star';
    const left = battle[won ? ME : FOE].pokemon.filter(p => !p.fainted).length;
    const ff = match && match.data.forfeit;
    const why = ff ? (ff === ME ? 'You forfeited.' : `${esc(foe.name)} forfeited.`) : `${left} Pokémon left standing after ${battle.turn} turns.`;
    html = `${emblem(ic, foe.color)}<h3>${won ? 'You beat ' + esc(foe.name) : esc(foe.name) + ' wins'}</h3><p>${why}</p>
      <div class="row" style="justify-content:center"><button class="btn primary" id="toSetup">Back to lobby</button></div>`;
  }
  $('result').innerHTML = html;
  $('overlay').hidden = false;
}
$('result').addEventListener('click', e => {
  if (e.target.id === 'rematch') { $('overlay').hidden = true; startCpuBattle(foe.key); }
  if (e.target.id === 'gNext') { $('overlay').hidden = true; ctx.stage++; runGauntletStage(); }
  if (e.target.id === 'gRetry') { $('overlay').hidden = true; startGauntlet(); }
  if (e.target.id === 'jToMap') { $('overlay').hidden = true; endBattleQuietly(); openMap({}); }
  if (e.target.id === 'jNewAfter') { $('overlay').hidden = true; endBattleQuietly(); ctx = null; openJourneyStart(); }
  if (e.target.id === 'toSetup') { $('overlay').hidden = true; leaveBattle(); }
});

function endBattleQuietly() {
  if (unsubMoves) { unsubMoves(); unsubMoves = null; }
  if (unsubMatch) { unsubMatch(); unsubMatch = null; }
  battle = null; match = null;
  $('overlay').hidden = true;
  $('battleMap').hidden = true;
}

function leaveBattle() {
  const wasJourney = ctx && ctx.kind === 'journey';
  const wasAdv = ctx && ctx.kind === 'adventure' ? ctx.fight : null;
  endBattleQuietly();
  ctx = null;
  if (wasJourney) { openMap({}); return; }
  if (wasAdv) { if (wasAdv.quest != null) openQuest(wasAdv.quest); else openAdvMap({}); return; }
  openHall();
}

$('online').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  const act = b.dataset.act, id = b.dataset.id;
  b.disabled = true;
  try {
    if (act === 'create') await createMatch();
    else if (act === 'cancel') await db.doc('matches/' + id).update({status: 'cancelled'});
    else if (act === 'join') await joinMatch(id);
    else if (act === 'resume') { const m = matches.find(x => x.id === id); if (m) openMatch(m.id, m.data); }
  } catch (err) {
    const box = $('online');
    const msg = document.createElement('div'); msg.className = 'note err';
    msg.textContent = err && err.code === 'invalid_argument' ? 'You need edit access to this page to battle online. Ask the owner to invite you by email as an Editor.' : (err && err.message) || 'Something went wrong. Check your connection and try again.';
    box.appendChild(msg);
  } finally { b.disabled = false; }
});

function playerInfo() {
  const text = myTeamText();
  const mine = myTeam();
  return {uid: myUid, name: profileName() || baseName(), key: mine.kind === 'gym' ? mine.key : null, color: mine.color || CUSTOM_COLOR, team: text};
}

function newId() {
  const a = 'abcdefghjkmnpqrstuvwxyz23456789';
  let s = ''; for (let i = 0; i < 8; i++) s += a[Math.floor(Math.random() * a.length)];
  return s;
}

async function createMatch() {
  if (!myTeamText()) { needTeam(); return; }
  // close any old open challenge of mine first
  for (const m of matches.filter(m => m.data.p1 && m.data.p1.uid === myUid && m.data.status === 'open')) {
    await db.doc('matches/' + m.id).update({status: 'cancelled'});
  }
  const id = newId();
  const seed = [0, 0, 0, 0].map(() => Math.floor(Math.random() * 0x10000));
  await db.doc('matches/' + id).set({status: 'open', seed, p1: playerInfo(), p2: null, createdAt: Date.now()});
}

async function joinMatch(id) {
  if (!myTeamText()) { needTeam(); return; }
  const ref = db.doc('matches/' + id);
  const lease = await ref.acquire({holder: myUid, ttlMs: 5000});
  if (!lease.acquired) throw {message: 'Someone else is joining that challenge right now.'};
  const snap = await ref.get();
  const d = snap.exists ? snap.data() : null;
  if (!d || d.status !== 'open' || d.p2) throw {message: 'That challenge is no longer open.'};
  const me = playerInfo();
  if (me.name === d.p1.name) me.name = me.name + ' 2';
  await ref.update({p2: me, status: 'active', startedAt: Date.now()});
  openMatch(id, {...d, p2: me, status: 'active'});
}

function openMatch(id, data) {
  if (unsubMoves) unsubMoves();
  if (unsubMatch) unsubMatch();
  mode = 'online';
  match = {id, data};
  ME = data.p1.uid === myUid ? 'p1' : 'p2';
  FOE = ME === 'p1' ? 'p2' : 'p1';
  const opp = data[FOE];
  foe = {name: opp.name, key: opp.key, color: opp.color || CUSTOM_COLOR};
  setAccent(foe.color);
  const t1 = E.parseTeam(data.p1.team).team, t2 = E.parseTeam(data.p2.team).team;
  beginBattle({name: data.p1.name, team: t1}, {name: data.p2.name, team: t2}, data.seed);
  choices = {p1: [], p2: []}; applied = {p1: 0, p2: 0};
  let first = true;
  show('battle');
  $('controls').innerHTML = '<div class="waiting">Loading the battle…</div>';
  unsubMoves = db.collection(`matches/${id}/moves`).onSnapshot(snap => {
    let changed = false;
    for (const d of snap.docs) {
      if (d.id !== 'p1' && d.id !== 'p2') continue;
      const list = (d.data() || {}).list || [];
      // never shrink our own list from a stale snapshot
      if (list.length > choices[d.id].length) { choices[d.id] = list.slice(); changed = true; }
    }
    if (first) { first = false; skip = true; changed = true; }
    if (changed) refresh();
  }, () => addLine('Lost the live connection to this battle. Reload the page to reconnect.', 'bad'));
  unsubMatch = db.doc('matches/' + id).onSnapshot(snap => {
    if (!snap.exists || !match || match.id !== id) return;
    const d = snap.data();
    const hadForfeit = match.data.forfeit;
    match.data = d;
    if (d.forfeit && !hadForfeit) refresh();
  });
}


// ---------- team guide ----------
const STAT_ORDER = ['hp', 'atk', 'def', 'spa', 'spd', 'spe'];
const STAT_LABEL = {hp: 'HP', atk: 'Atk', def: 'Def', spa: 'SpA', spd: 'SpD', spe: 'Spe'};
const ABILITY_IMMUNE = {levitate: 'Ground', waterabsorb: 'Water', dryskin: 'Water', stormdrain: 'Water', voltabsorb: 'Electric', lightningrod: 'Electric', motordrive: 'Electric', flashfire: 'Fire', sapsipper: 'Grass', eartheater: 'Ground'};
let infoKey = null, infoReturn = 'setup';

function calcStats(set, sp) {
  const nat = E.Dex.natures.get(set.nature || 'Serious');
  const L = set.level || 100, out = {};
  for (const s of STAT_ORDER) {
    const b = sp.baseStats[s], iv = set.ivs && set.ivs[s] != null ? set.ivs[s] : 31, ev = set.evs && set.evs[s] || 0;
    const core = Math.floor((2 * b + iv + Math.floor(ev / 4)) * L / 100);
    if (s === 'hp') out[s] = sp.baseStats.hp === 1 ? 1 : core + L + 10;
    else out[s] = Math.floor((core + 5) * (nat.plus === s ? 1.1 : nat.minus === s ? 0.9 : 1));
  }
  return {stats: out, nat};
}

function matchups(types, abilityId) {
  const groups = {};
  for (const t of E.Dex.types.names()) {
    if (t === 'Stellar') continue;
    let m = 1;
    for (const dt of types) m *= E.Dex.getImmunity(t, dt) ? Math.pow(2, E.Dex.getEffectiveness(t, dt)) : 0;
    if (ABILITY_IMMUNE[abilityId] === t) m = 0;
    if (abilityId === 'thickfat' && (t === 'Fire' || t === 'Ice')) m *= 0.5;
    if (abilityId === 'dryskin' && t === 'Fire') m *= 1.25;
    if (m === 1) continue;
    (groups[m] = groups[m] || []).push(t);
  }
  const rows = [[4, '4×', 'w'], [2.5, '2.5×', 'w'], [2, '2×', 'w'], [0.5, '½×', 'r'], [0.25, '¼×', 'r'], [0.125, '⅛×', 'r'], [0, 'None', 'i']];
  return rows.filter(([m]) => groups[m]).map(([m, label, cls]) => `<div><span class="k ${cls}">${label}</span>${typesHTML(groups[m])}</div>`).join('');
}

function statBlock(set, sp, title) {
  const {stats, nat} = calcStats(set, sp);
  const rows = STAT_ORDER.map(s => {
    const cls = nat.plus === s ? 'plus' : nat.minus === s ? 'minus' : '';
    const w = Math.min(100, stats[s] / (s === 'hp' ? 450 : 420) * 100);
    return `<span class="s ${cls}">${STAT_LABEL[s]}</span><span class="v">${stats[s]}</span><span class="bar" title="Base ${sp.baseStats[s]}"><i style="width:${w}%"></i></span>`;
  }).join('');
  const base = STAT_ORDER.map(s => `${STAT_LABEL[s]} ${sp.baseStats[s]}`).join(' · ');
  return `<div><div class="lbl">${esc(title)}</div><div class="statgrid">${rows}</div><div class="statnote">Base stats: ${base} (total ${STAT_ORDER.reduce((a, s) => a + sp.baseStats[s], 0)})</div></div>`;
}

function dexCard(set, idx) {
  const sp = E.Dex.species.get(set.species);
  const item = set.item ? E.Dex.items.get(set.item) : null;
  const ab = E.Dex.abilities.get(set.ability);
  const nat = E.Dex.natures.get(set.nature || 'Serious');
  const evs = STAT_ORDER.filter(s => set.evs && set.evs[s]).map(s => `${set.evs[s]} ${STAT_LABEL[s]}`).join(' / ') || 'None';
  const natTxt = nat.plus ? `${nat.name} (+${STAT_LABEL[nat.plus]}, −${STAT_LABEL[nat.minus]})` : `${nat.name} (no stat change)`;
  let mega = '';
  if (item && item.megaStone) {
    const megaName = typeof item.megaStone === 'string' ? item.megaStone : Object.values(item.megaStone)[0];
    const msp = E.Dex.species.get(megaName);
    if (msp.exists) {
      const mab = E.Dex.abilities.get(msp.abilities[0]);
      mega = `<div class="kv"><div class="lbl">Mega Evolution</div>
        <p><b>Mega ${esc(msp.baseSpecies)}</b> ${typesHTML(msp.types)}</p>
        <p><b>${esc(mab.name)}:</b> <span>${esc(mab.shortDesc || mab.desc)}</span></p></div>
        ${statBlock(set, msp, 'Stats after Mega Evolving')}
        <div><div class="lbl">Weaknesses after Mega Evolving</div><div class="mults">${matchups(msp.types, mab.id)}</div></div>`;
    }
  }
  const moves = set.moves.map(m => {
    const mv = E.Dex.moves.get(m);
    const acc = mv.accuracy === true ? 'Never misses' : `${mv.accuracy}% acc`;
    const pow = mv.category === 'Status' ? 'Status' : `${mv.category} · ${mv.basePower ? mv.basePower + ' power' : 'varies'}`;
    const pp = Math.floor(mv.pp * 8 / 5);
    const pri = mv.priority ? ` · Priority ${mv.priority > 0 ? '+' : ''}${mv.priority}` : '';
    return `<div class="mv" style="--t:${TYPE_COLORS[mv.type] || '#999'}"><div class="top"><b>${esc(mv.name)}</b>${typesHTML([mv.type])}</div>
      <div class="nums">${esc(pow)} · ${esc(acc)} · ${pp} PP${pri}</div><p>${esc(mv.shortDesc || mv.desc)}</p></div>`;
  }).join('');
  return `<details class="dex" ${idx === 0 ? 'open' : ''}>
    <summary><span class="nm">${esc(sp.name)}</span><span class="chev"></span>
      <span class="sub">${typesHTML(sp.types)} ${item ? '· ' + esc(item.name) : ''} · ${esc(ab.name)}</span></summary>
    <div class="dexbody">
      <div class="kv"><div class="lbl">Held item</div><p><b>${item ? esc(item.name) : 'None'}</b>${item ? ': <span>' + esc(item.shortDesc || item.desc) + '</span>' : ''}</p></div>
      <div class="kv"><div class="lbl">Ability</div><p><b>${esc(ab.name)}:</b> <span>${esc(ab.shortDesc || ab.desc)}</span></p></div>
      <div class="kv"><div class="lbl">Nature and training</div><p><b>${esc(natTxt)}</b></p><p><span>EVs: ${esc(evs)} · Level ${set.level || 100}</span></p></div>
      ${statBlock(set, sp, 'Stats at level ' + (set.level || 100))}
      <div><div class="lbl">Moves</div><div class="mvlist">${moves}</div></div>
      <div><div class="lbl">Damage taken by type</div><div class="mults">${matchups(sp.types, ab.id)}</div></div>
      ${mega}
    </div></details>`;
}

function renderInfo() {
  const mine = myTeam();
  const own = mine && mine.kind !== 'gym' ? mine : null;

// --- map ---
function mapPoints() {
  const pts = [{x: 180, y: 688}];
  const cols = [62, 180, 298];
  for (let i = 0; i < 18; i++) {
    const row = Math.floor(i / 3), c = i % 3, col = row % 2 ? 2 - c : c;
    pts.push({x: cols[col] + ((i * 37) % 21 - 10), y: 598 - row * 106 + ((i * 53) % 17 - 8)});
  }
  return pts; // pts[0] = home, pts[1..17] = gyms in journey order, pts[18] = Victory Summit
}
function segCtrl(a, b, i) {
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  const vertical = Math.abs(a.y - b.y) > 50;
  return {x: vertical ? mx + (a.x < 180 ? -42 : 42) : mx, y: vertical ? my : my + (i % 2 ? 26 : -26)};
}
function segPath(a, b, i) {
  const c = segCtrl(a, b, i);
  return `M${a.x} ${a.y} Q${c.x} ${c.y} ${b.x} ${b.y}`;
}
function rng(seed) { let s = seed; return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }
let terrainCache = null;
function terrain(pts) {
  if (terrainCache) return terrainCache;
  const r = rng(20261018);
  // keep scenery off the towns, their name labels and the road
  const road = [];
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i], c = segCtrl(a, b, i);
    for (let t = 0; t <= 1; t += 0.05) road.push({x: (1 - t) * (1 - t) * a.x + 2 * (1 - t) * t * c.x + t * t * b.x, y: (1 - t) * (1 - t) * a.y + 2 * (1 - t) * t * c.y + t * t * b.y});
  }
  const far = (x, y, d) => pts.every(p => Math.hypot(p.x - x, p.y - y) > d && !(Math.abs(p.x - x) < 52 && y > p.y && y < p.y + 52))
    && road.every(q => Math.hypot(q.x - x, q.y - y) > 16);
  let out = '';
  // sea along the right edge and a few lakes
  out += `<path d="M360 0 C330 80 345 160 322 240 C300 330 340 420 318 520 C300 600 336 660 360 720Z" fill="#17304a"/>`;
  for (let i = 0; i < 4; i++) {
    const x = 30 + r() * 280, y = 40 + r() * 600;
    if (far(x, y, 46)) out += `<ellipse cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" rx="${(18 + r() * 16).toFixed(0)}" ry="${(10 + r() * 8).toFixed(0)}" fill="#1b3550"/>`;
  }
  for (let i = 0; i < 60; i++) {
    const x = 10 + r() * 330, y = 20 + r() * 660;
    if (!far(x, y, 34)) continue;
    if (r() < 0.4) {
      const h = 12 + r() * 10;
      out += `<path d="M${(x - h * .7).toFixed(1)} ${y.toFixed(1)} L${x.toFixed(1)} ${(y - h).toFixed(1)} L${(x + h * .7).toFixed(1)} ${y.toFixed(1)}Z" fill="#2b3442"/><path d="M${(x - h * .22).toFixed(1)} ${(y - h * .68).toFixed(1)} L${x.toFixed(1)} ${(y - h).toFixed(1)} L${(x + h * .22).toFixed(1)} ${(y - h * .68).toFixed(1)}Z" fill="#53606f"/>`;
    } else {
      out += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(4 + r() * 4).toFixed(1)}" fill="#1f3a2c"/>`;
    }
  }
  terrainCache = out;
  return out;
}
const emblemAt = (kind, color, x, y, size) => emblem(kind, color).replace('<svg ', `<svg x="${x - size / 2}" y="${y - size / 2}" width="${size}" height="${size}" `);

function renderWorldMap(markerIdx, S, overlay = '') {
  const pts = mapPoints();
  const st = S.stage();
  const curStop = S.done ? 18 : Math.min(S.pos, 17) + 1; // index into pts of the place you're headed
  let svg = `<rect width="360" height="720" fill="#141c26"/>` + terrain(pts);
  // route
  for (let i = 1; i < pts.length; i++) {
    const done = i <= curStop;
    svg += `<path id="seg-${i}" d="${segPath(pts[i - 1], pts[i], i)}" fill="none" stroke="${done ? '#c9d3e3' : '#3a4658'}" stroke-width="${done ? 3 : 2.5}" ${done ? '' : 'stroke-dasharray="5 6"'} stroke-linecap="round"/>`;
  }
  // home
  const h = pts[0];
  svg += `<path d="M${h.x - 11} ${h.y + 7} V${h.y - 3} L${h.x} ${h.y - 12} L${h.x + 11} ${h.y - 3} V${h.y + 7}Z" fill="#c9d3e3"/><text x="${h.x}" y="${h.y + 24}" text-anchor="middle" font-size="10" fill="#95a0b2">${HOME}</text>`;
  // towns
  for (let i = 0; i < 17; i++) {
    const k = S.order[i], L = LEADERS[k], p = pts[i + 1];
    const cleared = i < S.pos, current = !S.done && i === S.pos;
    if (current) svg += `<circle class="ringpulse" cx="${p.x}" cy="${p.y}" r="24" fill="none" stroke="${L.color}" stroke-width="2"/>`;
    svg += `<circle cx="${p.x}" cy="${p.y}" r="17" fill="${cleared ? L.color : '#1d2633'}" stroke="${cleared || current ? L.color : '#3a4658'}" stroke-width="${current ? 3 : 2}"/>`;
    svg += emblemAt(L.icon, cleared ? '#10131a' : current ? L.color : '#56616f', p.x, p.y, 20);
    svg += `<text x="${p.x}" y="${p.y + 31}" text-anchor="middle" font-size="10" font-weight="${current ? 700 : 500}" fill="${current ? '#e9edf3' : cleared ? '#b4bdcb' : '#677286'}">${TOWNS[k]}</text>`;
  }
  // league
  const lg = pts[18], inLeague = S.pos >= 17;
  if (inLeague && !S.done) svg += `<circle class="ringpulse" cx="${lg.x}" cy="${lg.y}" r="26" fill="none" stroke="${CHAMP.color}" stroke-width="2"/>`;
  svg += `<circle cx="${lg.x}" cy="${lg.y}" r="19" fill="${S.done ? CHAMP.color : '#1d2633'}" stroke="${inLeague ? CHAMP.color : '#3a4658'}" stroke-width="${inLeague ? 3 : 2}"/>`;
  svg += emblemAt('crown', S.done ? '#10131a' : inLeague ? CHAMP.color : '#56616f', lg.x, lg.y, 22);
  svg += `<text x="${lg.x}" y="${lg.y + 33}" text-anchor="middle" font-size="10" font-weight="700" fill="${inLeague ? '#e9edf3' : '#677286'}">${LEAGUE}</text>`;
  svg += overlay; overlay = '';
  // you
  const m = pts[markerIdx];
  svg += `<g id="marker" transform="translate(${m.x} ${m.y})"><path d="M0 -20 c-7 0 -11 -5 -11 -10 a11 11 0 0 1 22 0 c0 5 -4 10 -11 10Z" fill="#ffffff" stroke="#10131a" stroke-width="1.5"/><circle cx="0" cy="-30" r="4" fill="${st && st.key ? LEADERS[st.key].color : CHAMP.color}"/></g>`;
  svg += overlay;
  $('mapSvg').innerHTML = svg;
}
function renderMap(markerIdx) {
  return renderWorldMap(markerIdx, {stage: jStage, done: J.done, pos: J.pos, order: J.order});
}
function scrollMapTo(y) {
  const wrap = $('mapWrap'), svg = $('mapSvg');
  const scale = svg.getBoundingClientRect().height / 720;
  wrap.scrollTop = Math.max(0, y * scale - wrap.clientHeight / 2);
}
function animateMarker(segIdx, done) {
  const path = $('mapSvg').querySelector(`#seg-${segIdx}`), mk = $('mapSvg').querySelector('#marker');
  if (!path || !mk || reducedMotion()) { done && done(); return; }
  const len = path.getTotalLength(), t0 = performance.now(), dur = 1500;
  const step = t => {
    const k = Math.min(1, (t - t0) / dur), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    const pt = path.getPointAtLength(e * len);
    mk.setAttribute('transform', `translate(${pt.x} ${pt.y})`);
    scrollMapTo(pt.y);
    if (k < 1) requestAnimationFrame(step); else done && done();
  };
  requestAnimationFrame(step);
}

        <div class="row" style="justify-content:center;margin-top:10px">

  const o = audio.createOscillator(), g = audio.createGain();

  g.gain.exponentialRampToValueAtTime(.0001, audio.currentTime + t0 + dur);

}
function sfxCharge(sec) {

  let t = 0, step = .28, k = 0;
  while (t < sec) { tone(330 * Math.pow(2, (notes[k % 4] + 12 * Math.floor(k / 8)) / 12), t, .22, 'triangle', .07); t += step; step = Math.max(.07, step * .93); k++; }
}
function sfxReveal() {

  [523, 659, 784, 1047, 1319].forEach(f => tone(f, .45, 1.6, 'triangle', .06));

const fx = {parts: [], raf: 0, mode: 'idle', colors: ['#fff'], spawnT: 0, fireT: 0};
function fxResize() { const c = $('evoCanvas'), d = Math.min(2, devicePixelRatio || 1); c.width = innerWidth * d; c.height = innerHeight * d; c.getContext('2d').setTransform(d, 0, 0, d, 0, 0); }
function fxCenter() { const o = document.querySelector('#evo .orb'); if (!o) return {x: innerWidth / 2, y: innerHeight * .42}; const r = o.getBoundingClientRect(); return {x: r.left + r.width / 2, y: r.top + r.height / 2}; }
function burst(x, y, n, speed, conf) {

    }

    const x = W * (.15 + Math.random() * .7), y = H * (.12 + Math.random() * .35);

  }

    fx.parts.push({x: Math.random() * W, y: -10, vx: (Math.random() - .5) * 1.5, vy: 1 + Math.random() * 2, life: 0, max: 400, size: 5 + Math.random() * 5, color: fx.colors[Math.floor(Math.random() * fx.colors.length)], conf: true, rot: Math.random() * 6, vr: (Math.random() - .5) * .3, g: .03, drag: .995});

async function evolveScene(m, ev) {
  const el = $('evo'), stage = $('evoStage');
  const before = E.statsAt(m.final, m.level, m.moves, ev.from), after = E.statsAt(m.final, m.level, m.moves, ev.to);
  const reduce = reducedMotion();

  fxResize(); addEventListener('resize', fxResize);

        setEvoColors(alt ? after.types : before.types);
        el.style.setProperty('--beat', Math.max(.12, gap / 1000) + 's');

    <div class="estats">${Object.keys(lbl).map(k => `<span>${lbl[k]} <b>${after.stats[k] - before.stats[k] > 0 ? '+' : ''}${after.stats[k] - before.stats[k]}</b></span>`).join('')}</div>
    <div class="row"><button class="btn primary" id="evoDone">Awesome!</button></div>`;
  if (!reduce) {

// Level the team up by n, playing evolutions and asking about moves. Returns summary lines.
async function growAndShow(n) {
  A.team.forEach(ensureMoves);
  const events = E.growTeam(A.team, n);
  saveA();
  const lines = [];
  for (const ev of events) {
    const m = A.team[ev.slot];
    if (ev.type === 'grew') lines.push(`${ev.species} grew to level ${ev.level}.`);
    else if (ev.type === 'evolve') { await evolveScene(m, ev); lines.push(`${ev.from} evolved into ${ev.to}!`); }
    else if (ev.type === 'learned') lines.push(`${ev.species} learned ${ev.move}!`);
    else if (ev.type === 'wants') {
      if (m.moves.includes(ev.move)) continue;
      const old = await chooseMove(m, ev.move);
      lines.push(old ? `${ev.species} forgot ${old} and learned ${ev.move}!` : `${ev.species} did not learn ${ev.move}.`);
    }
    saveA();
  }
  return lines;
}

function summaryHTML(lines) {
  // condense "X grew to level N" lines into one
  const grew = lines.filter(l => l.includes(' grew to level '));
  const other = lines.filter(l => !l.includes(' grew to level '));
  const out = [];
  if (grew.length) out.push(`<p>Your team grew to level ${A.team.map(m => m.level).join(', ')}.</p>`);
  for (const l of other) out.push(`<p class="${l.includes('evolved') ? 'evoline' : 'new'}">${esc(l)}</p>`);

}

$('builderBody').addEventListener('click', e => {

  }
  const act = b.dataset.act;
  if (act === 'more') { bf.limit += 40; renderResults(); }
  else if (act === 'save') saveBuilder();
  else if (act === 'back') { if (btDirty) { btLeave = true; renderBuilder(); } else openTeams(); }
  else if (act === 'leave') openTeams();
  else if (act === 'stay') { btLeave = false; renderBuilder(); }
});
$('builderBody').addEventListener('input', e => {
  if (e.target.id === 'btSearch') { bf.q = e.target.value; bf.limit = 40; renderResults(); }
  else if (e.target.id === 'btName') { bt.name = e.target.value; btDirty = true; }
});

// ---------- Mon editor ----------
let medIdx = 0, medAdvOpen = false;
const learnCache = {};
const learnFor = sp => learnCache[sp] || (learnCache[sp] = E.learnableMoves(sp));
function openMonEditor(i) { medIdx = i; medAdvOpen = false; renderMonEditor(); show('moned'); }
function renderMonEditor() {
  const m = bt.mons[medIdx], sp = E.Dex.species.get(m.species);
  const reg = E.regionalInfo(sp.name);
  const abil = E.abilitiesFor(sp.name), items = E.itemsFor(sp.name), moves = learnFor(sp.name);
  const set = E.builtSet(m), auto = E.autoSpread(sp.name, m.moves);
  const itemOpt = it => `<option value="${esc(it.name)}" ${it.name === m.item ? 'selected' : ''}>${esc(it.name)}</option>`;
  const itemInfo = m.item ? [...items.own, ...items.popular, ...items.other].find(it => it.name === m.item) : null;
  const abInfo = abil.find(a => a.name === set.ability);
  const mv = [0, 1, 2, 3].map(k => {
    const curName = (m.moves || [])[k] || '';
    const others = new Set((m.moves || []).filter((x, j) => x && j !== k));
    const info = moves.find(x => x.name === curName);
    return `<div class="field movepick" style="--t:${info ? TYPE_COLORS[info.type] : 'var(--line)'};padding-left:10px">
      <label for="medMove${k}">Move ${k + 1}</label>
      <select id="medMove${k}" data-f="move" data-k="${k}"><option value="">(none)</option>${moves.filter(x => !others.has(x.name)).map(x => `<option value="${esc(x.name)}" ${x.name === curName ? 'selected' : ''}>${esc(x.name)} · ${x.type}${x.power ? ' · ' + x.power : ''}</option>`).join('')}</select>
      ${info ? `<small class="note">${esc(info.category)}${info.accuracy ? ` · ${info.accuracy}% accuracy` : ''} · ${esc(info.desc || '')}</small>` : ''}</div>`;
  }).join('');
  const spreads = Object.entries(E.SPREADS).map(([k, v]) => `<option value="${k}" ${m.spread === k ? 'selected' : ''}>${esc(v.label)}</option>`).join('');
  const natures = E.NATURES().map(n => `<option value="${n.name}" ${m.nature === n.name ? 'selected' : ''}>${n.name}${n.plus ? ` (+${STAT_LABEL[n.plus]}, −${STAT_LABEL[n.minus]})` : ''}</option>`).join('');
  $('monedBody').innerHTML = `<header class="hallhead"><button class="iconbtn" type="button" data-act="done" aria-label="Back to the team">${BACK_SVG}</button><p class="note" style="flex:1;margin:0">${esc(bt.name)} · Mon ${medIdx + 1} of ${bt.mons.length}</p></header>
    <div class="monhero"><div class="pic">${artOf(sp.name) || '#' + sp.num}</div><div><small>${reg ? 'Neofield' : 'National'} #${pad3(reg ? reg.num : sp.num)} · Level 100</small><h1>${esc(sp.name)}</h1>${typesHTML(sp.types)}</div></div>
    <div class="fieldgrid">
      <div class="field"><label for="medAbility">Ability</label><select id="medAbility" data-f="ability">${abil.map(a => `<option value="${esc(a.name)}" ${a.name === set.ability ? 'selected' : ''}>${esc(a.name)}${a.hidden ? ' (hidden)' : ''}</option>`).join('')}</select>
        <small class="note">${esc(abInfo ? abInfo.desc : '')}</small></div>
      <div class="field"><label for="medItem">Held item</label><select id="medItem" data-f="item"><option value="">None</option>
        ${items.own.length ? `<optgroup label="Just for ${esc(sp.name)}">${items.own.map(itemOpt).join('')}</optgroup>` : ''}
        <optgroup label="Popular">${items.popular.map(itemOpt).join('')}</optgroup><optgroup label="All items">${items.other.map(itemOpt).join('')}</optgroup></select>
        <small class="note">${esc(itemInfo ? itemInfo.desc : 'No held item.')}</small></div>
    </div>
    <div class="section"><h2>Moves</h2>${mv}<p class="note">Only moves ${esc(sp.name)} can learn are listed.</p></div>
    <details class="adv" id="medAdv" ${medAdvOpen ? 'open' : ''}><summary>Advanced: nature and stat training</summary>
      <div class="fieldgrid">
        <div class="field"><label for="medNature">Nature</label><select id="medNature" data-f="nature"><option value="">Automatic (${auto.nature})</option>${natures}</select></div>
        <div class="field"><label for="medSpread">Stat training</label><select id="medSpread" data-f="spread"><option value="">Automatic (${esc(E.SPREADS[auto.spread].label)})</option>${spreads}${m.evs && !m.spread ? '<option value="custom" selected>From the pasted team</option>' : ''}</select></div>
      </div></details>
    ${statBlock(set, sp, 'Stats at level 100')}
    <div class="row"><button class="btn ghostbtn" type="button" data-act="remove" style="flex:1 1 0">Remove from team</button><button class="btn gold" type="button" data-act="done" style="flex:1 1 0">Done</button></div>`;
}
$('monedBody').addEventListener('change', e => {
  const f = e.target.dataset.f; if (!f) return;
  const m = bt.mons[medIdx], v = e.target.value;
  if (f === 'ability') m.ability = v;
  else if (f === 'item') m.item = v;
  else if (f === 'move') { m.moves = (m.moves || []).slice(); while (m.moves.length < 4) m.moves.push(''); m.moves[+e.target.dataset.k] = v; }
  else if (f === 'nature') m.nature = v || null;
  else if (f === 'spread') { if (v !== 'custom') { m.spread = v || null; m.evs = null; } }
  btDirty = true; btProblems = null;
  const top = $('monedScroll').scrollTop;
  renderMonEditor();
  $('monedScroll').scrollTop = top;
});
$('monedBody').addEventListener('toggle', e => { if (e.target.id === 'medAdv') medAdvOpen = e.target.open; }, true);
$('monedBody').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  if (b.dataset.act === 'remove') { bt.mons.splice(medIdx, 1); btDirty = true; btProblems = null; }
  const m = bt.mons[medIdx];
  if (m && m.moves) m.moves = m.moves.filter(Boolean);
  renderBuilder(); show('builder');
});

// ---------- intro: who's that Mon? ----------
// Plays once each time the app opens: 3 seconds of silhouette, the reveal, 3 more seconds,
// and then the title screen as soon as the battle engine has also finished loading.
const NEO_MONS = /*NEO_MONS*/[];
let introDone = false, engineReady = false, introFinished = false, fakeP = 8;
const fakeTimer = setInterval(() => {
  if (engineReady) return;
  fakeP = Math.min(90, fakeP + (90 - fakeP) * 0.06);
  $('whoisFill').style.width = fakeP + '%';
}, 150);
function finishIntro() {
  if (introFinished) return;
  if (!engineReady) { if (introDone) $('whoisStatus').textContent = 'Almost ready…'; return; }
  if (!introDone) return;
  introFinished = true;
  clearInterval(fakeTimer);
  $('whoisFill').style.width = '100%';
  openTitle();
  $('whois').classList.add('out');
  setTimeout(() => { $('whois').hidden = true; }, 550);
}
(function runIntro() {
  $('whoisStatus').textContent = 'Loading the battle engine…';
  const mons = NEO_MONS.filter(m => m.pic);
  if (!mons.length) { introDone = true; return; }
  const m = mons[Math.floor(Math.random() * mons.length)];
  const img = $('whoisImg');
  let started = false;
  const start = () => {
    if (started) return;
    started = true;
    img.hidden = false; $('whoisQ').hidden = false;
    setTimeout(() => {
      img.className = 'shown'; img.alt = m.name;
      $('whoisQ').hidden = true;
      $('whoisNum').textContent = `It's #${pad3(m.num)}`;
      $('whoisName').textContent = m.name + '!';
      $('whoisTypes').innerHTML = m.types.map(t => `<span class="type" style="--t:${TYPE_COLORS[t] || '#999'}">${esc(t)}</span>`).join('');
      $('whoisA').hidden = false;
      setTimeout(() => { introDone = true; finishIntro(); }, 3000);
    }, 3000);
  };
  img.alt = 'A mystery Mon in silhouette';
  img.onload = start;
  img.onerror = () => { if (!started) { introDone = true; finishIntro(); } };
  img.src = m.pic;
  setTimeout(start, 2500); // don't wait forever for the picture
})();

// ---------- save backup ----------
const SHARED_SAVE_KEYS = ['builtTeams', 'recentTeams', 'evoSound', 'lastSlot', 'saveVersion'];
const OLD_SAVE_KEYS = ['myTeam', 'customTeam', 'difficulty', 'badgeBook', 'badges', 'champions', 'journey', 'adventure'];
const isSaveKey = k => /^slot[1-4]\./.test(k) || SHARED_SAVE_KEYS.includes(k);
function saveCode() {
  const data = {};
  try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (isSaveKey(k)) data[k] = localStorage.getItem(k); } } catch (e) { /* storage unavailable */ }
  return 'GLB1:' + btoa(unescape(encodeURIComponent(JSON.stringify(data))));
}
$('saveCopy').addEventListener('click', async () => {
  const code = saveCode();
  $('saveBox').hidden = false; $('saveLoadRow').hidden = true;
  $('saveText').value = code; $('saveText').readOnly = true;
  let copied = false;
  try { await navigator.clipboard.writeText(code); copied = true; } catch (e) { /* clipboard blocked */ }
  if (!copied) { $('saveText').select(); try { copied = document.execCommand('copy'); } catch (e) { copied = false; } }
  $('saveNote').textContent = copied ? 'Save code copied. Paste it into a message to yourself.' : 'Select all the text above and copy it.';
});
$('saveLoadOpen').addEventListener('click', () => {
  $('saveBox').hidden = false; $('saveLoadRow').hidden = false;
  $('saveText').readOnly = false; $('saveText').value = ''; $('saveText').placeholder = 'Paste a save code that starts with GLB1:';
  $('saveNote').textContent = 'Loading a code replaces every save slot and built team on this device.';
  $('saveText').focus();
});
$('saveLoad').addEventListener('click', () => {
  const raw = $('saveText').value.trim();
  let data = null;
  try { if (raw.startsWith('GLB1:')) data = JSON.parse(decodeURIComponent(escape(atob(raw.slice(5))))); } catch (e) { data = null; }
  if (!data || typeof data !== 'object') { $('saveNote').textContent = "That doesn't look like a save code. Copy the whole thing, starting with GLB1:"; return; }
  try {
    const drop = [];
    for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (isSaveKey(k) || OLD_SAVE_KEYS.includes(k)) drop.push(k); }
    drop.forEach(k => localStorage.removeItem(k));
    for (const [k, v] of Object.entries(data)) if (isSaveKey(k) || OLD_SAVE_KEYS.includes(k)) localStorage.setItem(k, v);
    // a code from before save slots: let the move into Slot 1 run again
    if (!('saveVersion' in data)) localStorage.removeItem('saveVersion');
  } catch (e) { $('saveNote').textContent = "This device won't let the game save. Check that private browsing is off."; return; }
  $('saveNote').textContent = 'Save loaded. Restarting the game…';
  setTimeout(() => location.reload(), 600);
});

// ---------- boot ----------
setAccent('#e8c76a');
db = undefined;

async function connectOnline() {
  const c = window.claude;
  if (!c || !c.use) { db = null; renderOnline(); return; }
  try {
    const [d, u] = await Promise.all([c.use('db'), c.use('user')]);
    db = d; user = u;
    myUid = u ? await u.id() : null;
    if (u && u.can) { try { canWrite = await u.can('data.write'); } catch (e) { canWrite = null; } }
  } catch (e) { db = null; }
  renderOnline();
  if (!db || !myUid) return;
  db.collection('matches').orderBy('createdAt', 'desc').limit(60).onSnapshot(snap => {
    const prev = new Map(matches.map(m => [m.id, m.data.status]));
    matches = snap.docs.filter(d => d.exists).map(d => ({id: d.id, data: d.data()}));
    // When someone joins my open challenge, jump straight into the battle
    const started = matches.find(m => m.data.status === 'active' && m.data.p1 && m.data.p1.uid === myUid && prev.get(m.id) === 'open');
    if (started && !battle) { openMatch(started.id, started.data); return; }
    if ($('setup').hidden === false) renderOnline();
  }, () => { $('online').innerHTML = '<div class="note err">Lost the connection to the lobby. Reload the page to reconnect.</div>'; });
}

function boot() {
  E = window.Engine;
  if (!E) { $('whoisStatus').textContent = 'The battle engine did not load. Reload the page to try again.'; return; }
  convertLegacyTeams();
  migrateRegionalLines();
  engineReady = true;
  $('whoisFill').style.width = '100%';
  $('whoisStatus').textContent = 'Ready';
  finishIntro();
}
if (window.Engine) boot(); else window.addEventListener('load', boot);
connectOnline();
if ('serviceWorker' in navigator && location.protocol === 'https:' && !window.claude) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
